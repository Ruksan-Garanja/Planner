<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Elemental Duel</title>
<style>
:root{
  --bg:#0d1020; --bg2:#151a33; --card:#1b2142; --card2:#232a52; --line:#33396a;
  --text:#e8ebff; --dim:#9aa3d6; --good:#5ee6a0; --bad:#ff6b7d; --warn:#ffd166; --accent:#8b7bff;
  --fire:#ff7043; --nature:#66bb6a; --stone:#c2a77d; --storm:#fdd835; --water:#42a5f5;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; color:var(--text);
  background:radial-gradient(1200px 700px at 50% -10%,#232a63 0%,var(--bg) 60%) fixed; min-height:100vh;
}
.wrap{max-width:980px;margin:0 auto;padding:16px}
h1{margin:0;font-size:1.5rem;letter-spacing:.04em}
h1 span{color:var(--accent)}
h2{margin:0 0 4px;font-size:1.15rem}
h3{margin:0 0 8px;font-size:.8rem;text-transform:uppercase;letter-spacing:.1em;color:var(--dim)}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.ladder{display:flex;gap:6px}
.ladder i{width:26px;height:8px;border-radius:4px;background:var(--line)}
.ladder i.done{background:var(--good)} .ladder i.cur{background:var(--warn)}
.card{background:linear-gradient(180deg,var(--card),var(--bg2));border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.grid2{display:grid;grid-template-columns:1.25fr 1fr;gap:12px}
@media(max-width:760px){.grid2{grid-template-columns:1fr}}
.dim{color:var(--dim)} .small{font-size:.82rem}
button{font:inherit;color:inherit;cursor:pointer}
.btn{background:var(--accent);color:#fff;border:0;border-radius:10px;padding:10px 18px;font-weight:700;letter-spacing:.03em}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text);font-weight:500}
.btn.big{width:100%;padding:13px;font-size:1.05rem}
details summary{cursor:pointer;color:var(--dim)}
details p{margin:8px 0 0;line-height:1.5}

/* build screen */
.brow{display:grid;grid-template-columns:120px 1fr 62px 54px 46px;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid #ffffff10}
.brow:last-child{border:0}
.brow .nm{cursor:pointer;font-weight:600;display:flex;gap:6px;align-items:center}
.brow .nm.focus{color:#fff;text-shadow:0 0 12px currentColor}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:28px;height:28px;border-radius:8px;border:1px solid var(--line);background:var(--card2);font-weight:700}
.stepper button:disabled{opacity:.3}
.stepper b{min-width:24px;text-align:center}
.pbar{height:9px;background:#0006;border-radius:5px;overflow:hidden}
.pbar i{display:block;height:100%;border-radius:5px;transition:width .25s}
.stat{font-size:.8rem;text-align:right;color:var(--dim)} .stat b{color:var(--text)}
.rank{font-size:.7rem;color:var(--dim)}
.cols{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.chip{border:1px solid var(--line);background:var(--card2);border-radius:999px;padding:5px 11px;font-size:.85rem}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.chip:disabled{opacity:.35;cursor:not-allowed}
.pointsleft{font-size:1.4rem;font-weight:800}
.pointsleft.zero{color:var(--good)}
@media(max-width:520px){.brow{grid-template-columns:92px 1fr 48px;} .brow .s2,.brow .s3{display:none}}

/* battle */
.fighter{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center}
.fname{font-weight:800}
.hpbar{height:16px;background:#0007;border-radius:8px;overflow:hidden;position:relative}
.hpbar i{display:block;height:100%;background:linear-gradient(90deg,#d9435a,#ff8a6b);transition:width .5s}
.hpbar.you i{background:linear-gradient(90deg,#2ec27e,#6ef0b0)}
.hpnum{font-variant-numeric:tabular-nums;font-weight:700}
.pips{display:flex;gap:3px}
.pips i{width:16px;height:9px;border-radius:3px;background:#0007}
.pips i.on{background:var(--warn)}
.hist{display:flex;gap:3px;font-size:1.05rem;min-height:1.4rem}
.hist span{opacity:.9}
.mini{display:flex;gap:6px;flex-wrap:wrap;font-size:.78rem;color:var(--dim)}
.mini span{background:#0005;border-radius:6px;padding:2px 6px}
.arena{text-align:center;min-height:104px;display:flex;flex-direction:column;justify-content:center;gap:6px}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}
.mv{background:#0004;border-radius:10px;padding:8px;font-size:.88rem}
.mv .big{font-size:1.7rem;display:block}
.mv.hit{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.rel{font-weight:700;color:var(--warn)}
.ecards{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
@media(max-width:560px){.ecards{grid-template-columns:repeat(5,1fr);gap:4px}.ecard .rl{display:none}}
.ecard{border:2px solid var(--line);border-radius:12px;background:var(--card2);padding:8px 4px;text-align:center;transition:transform .1s}
.ecard:hover:not(:disabled){transform:translateY(-2px)}
.ecard.sel{border-color:var(--c);box-shadow:0 0 18px -2px var(--c);background:#2c3466}
.ecard .ic{font-size:1.7rem;display:block}
.ecard b{display:block;font-size:.85rem}
.ecard .pw{font-size:.74rem;color:var(--dim)}
.ecard .rl{font-size:.7rem;margin-top:3px;color:var(--dim);line-height:1.35}
.ecard:disabled{opacity:.3;cursor:not-allowed}
.sum{background:#0004;border-radius:10px;padding:9px 11px;font-size:.88rem;line-height:1.6;margin:10px 0}
.sum b{color:var(--warn)}
.log{max-height:190px;overflow:auto;font-size:.82rem;line-height:1.55;color:var(--dim)}
.log div{padding:2px 0;border-bottom:1px solid #ffffff0a}
.log .t{color:var(--text);font-weight:700}
.modal{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.modal .card{max-width:430px;text-align:center;margin:0}
.modal h2{font-size:1.6rem}
.formdesc{font-size:.8rem;color:var(--dim);min-height:1.2em}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>ELEMENTAL <span>DUEL</span></h1>
    <div class="ladder" id="ladder"></div>
  </header>
  <div id="app"></div>
</div>
<div id="modal"></div>

<script>
/* ======================= ENGINE ======================= */
const ORDER=['fire','nature','stone','storm','water'];
const EL={
  fire:{name:'Fire',icon:'🔥',color:'#ff7043'},
  nature:{name:'Nature',icon:'🌿',color:'#66bb6a'},
  stone:{name:'Stone',icon:'🪨',color:'#c2a77d'},
  storm:{name:'Storm',icon:'⚡',color:'#fdd835'},
  water:{name:'Water',icon:'💧',color:'#42a5f5'}
};
const POOL=20, MAXHP=100, MAXEN=10, REGEN=3, BASE=3.5;
const FORMS={
  strike:{name:'Strike',dmg:1,  extra:0,desc:'Balanced attack.'},
  pierce:{name:"Pierce",dmg:.75, extra:0,desc:'-25% damage, but being resisted hurts less (x0.7 instead of x0.4) and it halves enemy wards.'},
  surge: {name:'Surge', dmg:1.5,extra:1,desc:'+50% damage for +1 energy. If the enemy counters you, you take +25% damage.'},
  ward:  {name:'Ward',  dmg:.3, extra:0,desc:'Weak attack plus a shield of your element. If your element beats theirs the shield is x1.5 and reflects 30%; if it loses, x0.5.'},
  focus: {name:'Focus', dmg:0,  extra:0,desc:'No attack. Recover +4 bonus energy, but you are exposed: +25% damage taken.'}
};
const idx=e=>ORDER.indexOf(e);
function beats(a,b){const d=(idx(b)-idx(a)+5)%5;return d===1||d===2}
function relation(a,b){ if(!b) return 'open'; if(a===b) return 'same'; return beats(a,b)?'adv':'res'; }
/* Mastery: convex curve -> splitting points weakens every element, stacking sharpens one */
const power   =p=>0.6+0.95*Math.pow(Math.min(p,30)/20,1.3);
const discount=p=>p>=12?1:0;
const critChance=p=>0.05+0.25*Math.min(p/20,1.2);
const rank=p=>p>=16?'Master':p>=10?'Expert':p>=5?'Adept':p>=1?'Novice':'—';
const TYPE_MULT={adv:1.6,same:1,res:.4,open:1.25};

function mkBuild(o){const b={};ORDER.forEach(e=>b[e]=o[e]||0);return b}
function mkFighter(name,build){return{name,build,hp:MAXHP,energy:MAXEN,streakEl:null,streak:0,hist:[]}}
function costOf(f,m){
  if(m.form==='focus') return 0;
  return Math.max(1,m.int+FORMS[m.form].extra-discount(f.build[m.el]));
}
function streakBonus(f,m){
  if(m.form==='focus'||f.streakEl!==m.el) return 1;
  const p=f.build[m.el];
  return 1+Math.min(f.streak,3)*0.1*Math.min(1.5,Math.max(.3,p/10));
}
function attackDmg(f,m,rel,crit){
  if(m.form==='focus') return 0;
  let mult=TYPE_MULT[rel];
  if(rel==="res"&&m.form==="pierce") mult=.7;
  return BASE*m.int*power(f.build[m.el])*FORMS[m.form].dmg*mult*streakBonus(f,m)*(crit?1.5:1);
}
function wardShield(f,m,rel){
  if(m.form!=='ward') return 0;
  const k={adv:1.5,same:1,res:.5,open:0}[rel];
  return BASE*1.6*m.int*power(f.build[m.el])*k;
}
function resolve(P,E,mp,me,turn,rng=Math.random){
  const stress=1+0.1*Math.max(0,turn-12);
  const side=(A,m,mo)=>{
    const o={m,dmg:0,shield:0,crit:false,rel:null,streak:streakBonus(A,m)};
    if(m.form==='focus') return o;
    o.rel=relation(m.el,mo.form==='focus'?null:mo.el);
    o.crit=rng()<critChance(A.build[m.el]);
    o.dmg=attackDmg(A,m,o.rel,o.crit)*stress;
    o.shield=wardShield(A,m,o.rel);
    return o;
  };
  const sp=side(P,mp,me), se=side(E,me,mp);
  const incoming=(def,md,atk,ma,sDef,sAtk)=>{
    let d=sAtk.dmg, exposed=false;
    if(md.form==='focus'||(md.form==='surge'&&sDef.rel==='res')){d*=1.25;exposed=true}
    let sh=sDef.shield; if(ma.form==='pierce') sh*=.5;
    const absorbed=Math.min(sh,d); d-=absorbed;
    const reflect=(md.form==='ward'&&sDef.rel==='adv')?absorbed*.3:0;
    return{dmg:d,absorbed,reflect,exposed};
  };
  const toP=incoming(P,mp,E,me,sp,se), toE=incoming(E,me,P,mp,se,sp);
  const dP=Math.round(toP.dmg+toE.reflect), dE=Math.round(toE.dmg+toP.reflect);
  return{sp,se,toP,toE,dP,dE,stress};
}
function endTurn(f,m){
  if(m.form!=='focus'){
    f.streak=(f.streakEl===m.el)?f.streak+1:0; f.streakEl=m.el;
  } else {f.streak=0;f.streakEl=null}
  f.energy=Math.min(MAXEN,f.energy-costOf(f,m)+REGEN+(m.form==='focus'?4:0));
  f.hist.push(m.form==='focus'?null:m.el);
}
function pickW(items,w,rng=Math.random){
  const t=w.reduce((a,b)=>a+b,0); let r=rng()*t;
  for(let i=0;i<items.length;i++){r-=w[i]; if(r<=0) return items[i]}
  return items[items.length-1];
}
/* Enemy brain. prof: {skill:0-1 (read the player), predict:'last'|'freq'|'none', habit:0-1 (repeat own element)} */
function aiChoose(E,P,prof,rng=Math.random){
  if(E.energy<=2&&rng()<.75) return{form:'focus',el:null,int:0};
  let pred=null;
  const ph=P.hist.filter(x=>x);
  if(rng()<prof.skill&&ph.length){
    if(prof.predict==='last') pred=ph[ph.length-1];
    else if(prof.predict==='freq'){
      const rec=P.hist.slice(-6).filter(x=>x), cnt={};
      rec.forEach(x=>cnt[x]=(cnt[x]||0)+1);
      const ks=Object.keys(cnt); if(ks.length) pred=pickW(ks,ks.map(k=>cnt[k]*cnt[k]),rng);
    }
  }
  const els=ORDER.filter(e=>E.build[e]>0);
  const last=E.hist.length?E.hist[E.hist.length-1]:null;
  const w=els.map(e=>{
    let x=Math.pow(power(E.build[e]),1.6);
    if(pred){ if(beats(e,pred)) x*=3; else if(beats(pred,e)) x*=.25; }
    if(last&&e===last&&prof.habit) x*=1+prof.habit*2;
    return x;
  });
  const el=pickW(els,w,rng);
  const lowHp=E.hp<30;
  const fw=[5,2.2,2.4,lowHp?3:1]; const fn=['strike','pierce','surge','ward'];
  if(pred&&beats(pred,el)) fw[1]+=2;
  let form=pickW(fn,fw,rng);
  let int=pickW([1,2,3,4,5],[1,3,4,3,2],rng);
  if(E.energy>=9) int=Math.max(int,3);
  int=Math.min(int,5);
  let m={el,int,form};
  while(costOf(E,m)>E.energy&&m.int>1) m.int--;
  if(costOf(E,m)>E.energy) m.form='strike';
  if(costOf(E,m)>E.energy) return{form:'focus',el:null,int:0};
  return m;
}
/* ======================= (test hook) ======================= */
if(typeof module!=='undefined') module.exports={ORDER,mkBuild,mkFighter,resolve,endTurn,aiChoose,costOf,power,beats,POOL,MAXHP,rng:null};
//#UI
if(typeof document!=='undefined'){
const ENEMIES=[
  {name:'Ember Acolyte',title:'Apprentice of the Flame',blurb:'A devoted specialist. Hits hard, but repeats himself. Learn his rhythm.',
   build:mkBuild({fire:15,water:5}),ai:{skill:.2,predict:'last',habit:.5}},
  {name:'Tidecaller Mara',title:'Duelist of the Deep',blurb:'Two elements, balanced. Reads your last move now and then.',
   build:mkBuild({water:10,stone:10}),ai:{skill:.4,predict:'last',habit:.2}},
  {name:'Grove Warden',title:'Keeper of the Old Wood',blurb:'Leans on Nature but swaps to Storm when you adapt.',
   build:mkBuild({nature:12,storm:8}),ai:{skill:.5,predict:'freq',habit:.2}},
  {name:'Stormweaver Kei',title:'Generalist of Many Winds',blurb:'Has a little of everything, so there is always a counter to your move. Individually weak, though.',
   build:mkBuild({fire:4,nature:4,stone:4,storm:4,water:4}),ai:{skill:.65,predict:'freq',habit:0}},
  {name:'The Prism Sage',title:'Final Trial',blurb:'Hybrid build, sharp mind. It studies your habits and counters them.',
   build:mkBuild({storm:8,fire:6,stone:6}),ai:{skill:.8,predict:'freq',habit:.05}}
];
const $=s=>document.querySelector(s);
const G={level:0,build:mkBuild({fire:10,water:10}),focus:'fire',P:null,E:null,turn:1,sel:{el:'fire',int:3,form:'strike'},last:null,log:[],over:false,wins:0};

function pts(b){return ORDER.reduce((a,e)=>a+b[e],0)}
function icons(h){return h.slice(-8).map(x=>`<span title="${x?EL[x].name:'Focus'}">${x?EL[x].icon:'💤'}</span>`).join('')}
function ladder(){
  $('#ladder').innerHTML=ENEMIES.map((_,i)=>`<i class="${i<G.level?'done':i===G.level?'cur':''}"></i>`).join('');
}
function relText(e){
  const strong=ORDER.filter(x=>x!==e&&beats(e,x)).map(x=>EL[x].icon).join('');
  const weak=ORDER.filter(x=>x!==e&&beats(x,e)).map(x=>EL[x].icon).join('');
  return `beats ${strong}<br>weak to ${weak}`;
}
function buildBars(b){
  return ORDER.filter(e=>b[e]>0).map(e=>`<span style="color:${EL[e].color}">${EL[e].icon} ${b[e]} <small>${rank(b[e])}</small></span>`).join('');
}

/* ---------- BUILD SCREEN ---------- */
function renderBuild(){
  ladder();
  const en=ENEMIES[G.level], left=POOL-pts(G.build);
  $('#app').innerHTML=`
  <div class="card">
    <details ${G.level===0?'open':''}><summary>How to play</summary>
    <p><b>Elements form a cycle:</b> each element beats the two after it and loses to the two before it
    (🔥→🌿🪨 · 🌿→🪨⚡ · 🪨→⚡💧 · ⚡→💧🔥 · 💧→🔥🌿). Every turn both duelists pick <b>an element, an intensity (1–5) and a form</b> in secret, then both strike at once.
    Intensity costs <b>energy</b> (you regain ${REGEN} a turn, max ${MAXEN}), so you can't go all out forever.
    Before the duel you spend <b>${POOL} training points</b>. Mastery is convex: the more points in one element, the stronger, crit-prone and cheaper it gets,
    but spread thin and every element is weak. Specialists are sharp but readable; generalists are flexible but soft.</p></details>
  </div>
  <div class="grid2">
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div><h2>Forge your affinity</h2><div class="dim small">Click an element name to set the preset focus.</div></div>
        <div class="pointsleft ${left===0?'zero':''}">${left}<span class="dim small"> / ${POOL} left</span></div>
      </div>
      <div class="cols">
        <button class="chip" data-a="preset" data-v="1">Specialist</button>
        <button class="chip" data-a="preset" data-v="2">Duelist 10/10</button>
        <button class="chip" data-a="preset" data-v="3">Tri-weave 7/7/6</button>
        <button class="chip" data-a="preset" data-v="5">Balanced 4×5</button>
        <button class="chip" data-a="preset" data-v="0">Clear</button>
      </div>
      ${ORDER.map(e=>{const p=G.build[e];return`
      <div class="brow">
        <div class="nm ${G.focus===e?'focus':''}" data-a="focus" data-e="${e}" style="color:${EL[e].color}">${EL[e].icon} ${EL[e].name}</div>
        <div><div class="stepper">
          <button data-a="dec" data-e="${e}" ${p<=0?'disabled':''}>−</button><b>${p}</b>
          <button data-a="inc" data-e="${e}" ${left<=0?'disabled':''}>+</button>
          <div class="pbar" style="flex:1"><i style="width:${p/POOL*100}%;background:${EL[e].color}"></i></div></div>
          <div class="rank">${rank(p)}</div></div>
        <div class="stat">power<br><b>×${power(p).toFixed(2)}</b></div>
        <div class="stat s2">crit<br><b>${Math.round(critChance(p)*100)}%</b></div>
        <div class="stat s3">cost<br><b>${discount(p)?'−'+discount(p):'—'}</b></div>
      </div>`}).join('')}
      <div class="dim small" style="margin-top:8px">Power multiplies damage and ward strength. Cost: ≥8 pts saves 1 energy, ≥16 saves 2. Repeating an element builds Resonance, bigger with mastery.</div>
    </div>
    <div class="card">
      <h3>Opponent ${G.level+1} / ${ENEMIES.length}</h3>
      <h2>${en.name}</h2><div class="dim small">${en.title}</div>
      <p class="small" style="line-height:1.5">${en.blurb}</p>
      <div class="mini" style="margin-bottom:10px">${buildBars(en.build)}</div>
      <button class="btn big" data-a="start" ${left!==0?'disabled':''}>${left!==0?`Spend ${left} more point${left>1?'s':''}`:'Begin duel ⚔'}</button>
    </div>
  </div>`;
}
function preset(n){
  n=+n; const b=mkBuild({}); const o=ORDER.indexOf(G.focus);
  const splits={1:[20],2:[10,10],3:[7,7,6],5:[4,4,4,4,4],0:[]}[n];
  splits.forEach((v,i)=>b[ORDER[(o+i)%5]]=v);
  G.build=b; renderBuild();
}

/* ---------- BATTLE ---------- */
function startDuel(){
  const en=ENEMIES[G.level];
  G.P=mkFighter('You',{...G.build}); G.E=mkFighter(en.name,{...en.build});
  G.turn=1; G.log=[]; G.over=false; G.last=null;
  const first=ORDER.reduce((a,e)=>G.build[e]>G.build[a]?e:a,ORDER[0]);
  G.sel={el:first,int:3,form:'strike'};
  addLog(`<span class="t">Duel begins vs ${en.name}.</span>`);
  renderBattle();
}
function addLog(h){G.log.unshift(`<div>${h}</div>`)}
function curMove(){return G.sel.form==='focus'?{form:'focus',el:null,int:0}:{...G.sel}}
function fixSel(){
  const s=G.sel;
  if(s.form!=='focus'){
    if(G.P.build[s.el]<=0) s.el=ORDER.find(e=>G.P.build[e]>0);
    while(costOf(G.P,curMove())>G.P.energy&&s.int>1) s.int--;
    if(costOf(G.P,curMove())>G.P.energy) s.form='strike';
    if(costOf(G.P,curMove())>G.P.energy) s.form='focus';
  }
}
function pips(n){return`<div class="pips">${Array.from({length:MAXEN},(_,i)=>`<i class="${i<n?'on':''}"></i>`).join('')}</div>`}
function fighterPanel(f,you){
  return`<div class="fighter">
    <div class="fname">${you?'🧙 You':'👹 '+f.name}</div><div class="hpnum">${Math.max(0,f.hp)} / ${MAXHP} HP</div>
    <div class="hpbar ${you?'you':''}" style="grid-column:1/-1"><i style="width:${Math.max(0,f.hp)}%"></i></div>
    <div>${pips(f.energy)}<div class="dim small">Energy ${f.energy}/${MAXEN}</div></div>
    <div class="hist" title="recent moves">${icons(f.hist)}</div>
    <div class="mini" style="grid-column:1/-1">${buildBars(f.build)}</div>
  </div>`;
}
function estimate(f,m){
  const r=k=>Math.round(attackDmg(f,m,k,false));
  return{adv:r('adv'),same:r('same'),res:r('res'),open:r('open')};
}
function renderArena(){
  const L=G.last;
  if(!L) return `<div class="dim">Choose your element, intensity and form, then unleash.</div>`;
  const mv=(m,s,who,hitFlag)=>{
    if(m.form==='focus') return `<div class="mv ${hitFlag?'hit':''}"><span class="big">💤</span>${who}<br>Focus (+4 energy)</div>`;
    return `<div class="mv ${hitFlag?'hit':''}"><span class="big">${EL[m.el].icon}</span>${who}<br>${EL[m.el].name} · I${m.int} · ${FORMS[m.form].name}<br>
      ${m.form==='ward'?`<small class="dim">shield ${Math.round(s.shield)}</small>`:''}</div>`;
  };
  const phrase=(a,b,sa)=>{
    if(!a.el) return''; if(!b.el) return'';
    if(sa.rel==='adv') return `${EL[a.el].name} overpowers ${EL[b.el].name}`;
    if(sa.rel==='res') return `${EL[a.el].name} is resisted by ${EL[b.el].name}`;
    return `${EL[a.el].name} clashes with ${EL[b.el].name}`;
  };
  const pl=phrase(L.mp,L.me,L.r.sp);
  return `<div class="vs">${mv(L.mp,L.r.sp,'You',L.r.dP>0)}<div class="rel">VS</div>${mv(L.me,L.r.se,G.E.name,L.r.dE>0)}</div>
  <div class="rel">${pl}</div>
  <div class="small">You dealt <b style="color:var(--good)">${L.r.dE}</b> · took <b style="color:var(--bad)">${L.r.dP}</b></div>`;
}
function renderBattle(){
  ladder(); fixSel();
  const P=G.P,E=G.E,s=G.sel,m=curMove(),foc=s.form==='focus';
  const cost=costOf(P,m), est=foc?null:estimate(P,m);
  const pp=foc?0:P.build[s.el], sb=foc?1:streakBonus(P,m);
  $('#app').innerHTML=`
  <div class="card">${fighterPanel(E,false)}</div>
  <div class="card arena" id="arena">${renderArena()}</div>
  <div class="card">${fighterPanel(P,true)}</div>
  <div class="card">
    <h3>Element</h3>
    <div class="ecards">${ORDER.map(e=>{const p=P.build[e];const aff=costOf(P,{el:e,int:1,form:'strike'})<=P.energy;
      return`<button class="ecard ${s.el===e&&!foc?'sel':''}" style="--c:${EL[e].color}" data-a="el" data-e="${e}" ${p<=0||foc?'disabled':''}>
        <span class="ic">${EL[e].icon}</span><b>${EL[e].name}</b><span class="pw">×${power(p).toFixed(2)} · ${p}pt</span><div class="rl">${relText(e)}</div></button>`}).join('')}</div>
    <h3 style="margin-top:12px">Intensity</h3>
    <div class="cols">${[1,2,3,4,5].map(i=>{const tm=foc?0:costOf(P,{...m,int:i});return`<button class="chip ${s.int===i&&!foc?'on':''}" data-a="int" data-i="${i}" ${foc||tm>P.energy?'disabled':''}>${i} <small>(${foc?'–':tm+'⚡'})</small></button>`}).join('')}</div>
    <h3 style="margin-top:12px">Form</h3>
    <div class="cols">${Object.keys(FORMS).map(f=>{const tm=f==='focus'?0:costOf(P,{el:foc?ORDER.find(e=>P.build[e]>0):s.el,int:1,form:f});
      return`<button class="chip ${s.form===f?'on':''}" data-a="form" data-f="${f}" ${tm>P.energy?'disabled':''}>${FORMS[f].name}</button>`}).join('')}</div>
    <div class="formdesc">${FORMS[s.form].desc}</div>
    <div class="sum">${foc?`Recover energy to <b>${Math.min(MAXEN,P.energy+REGEN+4)}</b>. You deal no damage and take +25%.`:
      `Cost <b>${cost}⚡</b> (left ${P.energy-cost}→${Math.min(MAXEN,P.energy-cost+REGEN)} after regen) · Crit <b>${Math.round(critChance(pp)*100)}%</b>${sb>1?` · Resonance <b>×${sb.toFixed(2)}</b>`:''}<br>
       Damage if you <b style="color:var(--good)">counter</b> ≈ <b>${est.adv}</b> · even ≈ <b>${est.same}</b> · <b style="color:var(--bad)">countered</b> ≈ <b>${est.res}</b>${s.form==='ward'?` · shield ≈ <b>${Math.round(wardShield(P,m,'same'))}</b> (even)`:''}`}</div>
    <button class="btn big" data-a="play">${foc?'Focus & recover':'Unleash '+EL[s.el].icon+' '+EL[s.el].name}</button>
  </div>
  <div class="card"><h3>Turn ${G.turn} · battle log</h3><div class="log">${G.log.join('')}</div></div>`;
}
function describe(who,m,s,toSelf,r){
  if(m.form==='focus') return `${who} focuses.`;
  let t=`${who}: ${EL[m.el].icon} ${EL[m.el].name} I${m.int} ${FORMS[m.form].name}`;
  if(s.streak>1) t+=` (resonance ×${s.streak.toFixed(2)})`;
  if(s.crit) t+=' <b style="color:var(--warn)">CRIT</b>';
  if(m.form==='ward') t+=` · shield ${Math.round(s.shield)}`;
  return t;
}
function play(){
  if(G.over) return;
  const P=G.P,E=G.E,en=ENEMIES[G.level];
  const mp=curMove(); if(costOf(P,mp)>P.energy) return;
  const me=aiChoose(E,P,en.ai);
  const r=resolve(P,E,mp,me,G.turn);
  P.hp-=r.dP; E.hp-=r.dE;
  addLog(`&nbsp;&nbsp;${describe(E.name,me,r.se)} → <b style="color:var(--bad)">${r.dP}</b> dmg${r.toP.absorbed>0?` (your ward blocked ${Math.round(r.toP.absorbed)})`:''}${r.toP.reflect>0?` · reflected ${Math.round(r.toP.reflect)}`:''}`);
  addLog(`<span class="t">T${G.turn}</span> ${describe('You',mp,r.sp)} → <b style="color:var(--good)">${r.dE}</b> dmg${r.toE.absorbed>0?` (ward blocked ${Math.round(r.toE.absorbed)})`:''}`);
  G.last={mp,me,r};
  endTurn(P,mp); endTurn(E,me); G.turn++;
  if(P.hp<=0||E.hp<=0){ G.over=true; renderBattle(); setTimeout(finish,650); }
  else renderBattle();
}
function finish(){
  const P=G.P,E=G.E; let h,onBtn;
  if(P.hp<=0&&E.hp<=0) h=`<h2>⚖ Draw</h2><p class="dim">You both fall together. Rematch?</p><button class="btn big" data-a="retry">Rematch</button>`;
  else if(P.hp<=0) h=`<h2>💀 Defeated</h2><p class="dim">${E.name} outlasted you. Re-forge your affinity and try again.</p><button class="btn big" data-a="retry">Re-forge &amp; retry</button>`;
  else if(G.level>=ENEMIES.length-1) h=`<h2>🏆 Grand Duelist!</h2><p class="dim">You beat all ${ENEMIES.length} opponents in ${G.turn-1} turns on the last fight.</p><button class="btn big" data-a="restart">Play again</button>`;
  else h=`<h2>✨ Victory</h2><p class="dim">${E.name} is down with ${P.hp} HP left. Next: <b>${ENEMIES[G.level+1].name}</b>. You may re-allocate your training points.</p><button class="btn big" data-a="next">Next opponent</button>`;
  $('#modal').innerHTML=`<div class="modal"><div class="card">${h}</div></div>`;
}

/* ---------- events ---------- */
document.addEventListener('click',ev=>{
  const t=ev.target.closest('[data-a]'); if(!t||t.disabled) return;
  const a=t.dataset.a;
  if(a==='inc'&&POOL-pts(G.build)>0){G.build[t.dataset.e]++;renderBuild()}
  else if(a==='dec'&&G.build[t.dataset.e]>0){G.build[t.dataset.e]--;renderBuild()}
  else if(a==='focus'){G.focus=t.dataset.e;renderBuild()}
  else if(a==='preset') preset(t.dataset.v);
  else if(a==='start'&&pts(G.build)===POOL) startDuel();
  else if(a==='el'){G.sel.el=t.dataset.e;if(G.sel.form==='focus')G.sel.form='strike';renderBattle()}
  else if(a==='int'){G.sel.int=+t.dataset.i;renderBattle()}
  else if(a==='form'){G.sel.form=t.dataset.f;renderBattle()}
  else if(a==='play') play();
  else if(a==='retry'||a==='next'||a==='restart'){
    $('#modal').innerHTML='';
    if(a==='next') G.level++; if(a==='restart'){G.level=0;G.build=mkBuild({fire:10,water:10})}
    renderBuild(); window.scrollTo(0,0);
  }
});
renderBuild();
}
</script>
</body>
</html>
