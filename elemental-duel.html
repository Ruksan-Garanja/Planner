<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Elemental Duel</title>
<style>
:root{
  --bg:#0b0e1d; --bg2:#141936; --card:#1a2040; --card2:#232a55; --line:#343b70;
  --text:#eef0ff; --dim:#8f98cf; --good:#5ee6a0; --bad:#ff6b7d; --warn:#ffd166; --accent:#8b7bff;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--text);
  background:radial-gradient(900px 600px at 50% -10%,#262e6e 0%,var(--bg) 65%) fixed;min-height:100vh;user-select:none}
.wrap{max-width:520px;margin:0 auto;padding:12px 12px 40px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:disabled{cursor:not-allowed}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.logo{font-weight:900;letter-spacing:.12em;font-size:.95rem}
.ladder{display:flex;gap:6px}
.ladder span{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:1rem;background:var(--card);border:2px solid var(--line);filter:grayscale(1) opacity(.5)}
.ladder span.done{filter:none;border-color:var(--good)} .ladder span.cur{filter:none;border-color:var(--warn);box-shadow:0 0 10px var(--warn)}
.card{background:linear-gradient(180deg,var(--card),var(--bg2));border:1px solid var(--line);border-radius:18px;padding:12px;margin-bottom:10px}
.dim{color:var(--dim)}
.row{display:flex;align-items:center;gap:8px}
.sp{flex:1}
.orb{--c:#fff;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:1.4rem;
  background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--c) 55%,#fff 0%),color-mix(in srgb,var(--c) 18%,#000) 75%);
  border:2px solid var(--c);box-shadow:0 0 14px -3px var(--c);flex:none}
.orb.big{width:84px;height:84px;font-size:2.6rem}
.avatar{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;font-size:2rem;background:#0006;border:2px solid var(--line);flex:none}
/* bars */
.bar{flex:1;height:16px;border-radius:9px;background:#0008;overflow:hidden;position:relative}
.bar i{position:absolute;left:0;top:0;height:100%;border-radius:9px;transition:width .35s cubic-bezier(.2,.8,.2,1)}
.bar.hp i{background:linear-gradient(90deg,#d9435a,#ff8a6b)} .bar.hp.you i{background:linear-gradient(90deg,#2ec27e,#7bf3b9)}
.bar b{position:absolute;z-index:2;inset:0;display:grid;place-items:center;font-size:.72rem;text-shadow:0 1px 2px #000}
.pips{display:flex;gap:3px} .pips i{width:15px;height:10px;border-radius:3px;background:#0008}
.pips i.on{background:var(--warn);box-shadow:0 0 6px #ffd16688}
.hist{display:flex;gap:2px;font-size:.95rem;min-height:1.3rem}
.tag{display:inline-flex;gap:3px;align-items:center;background:#0006;border-radius:8px;padding:2px 7px;font-size:.78rem;white-space:nowrap}
.stars{color:var(--warn);letter-spacing:-1px;font-size:.7rem}
.fighter{display:flex;flex-direction:column;gap:7px}
/* wheel */
.wheel{display:block;width:100%;max-width:340px;margin:0 auto;touch-action:manipulation}
.wheel g[data-a]{cursor:pointer}
.wheel .n{transition:transform .12s;transform-box:fill-box;transform-origin:center}
.wheel g[data-a]:active .n{transform:scale(.92)}
/* build */
.brow{display:grid;grid-template-columns:44px 1fr;gap:6px 10px;align-items:center;padding:6px 0}
.step{display:flex;align-items:center;gap:6px}
.step button{width:34px;height:34px;border-radius:10px;background:var(--card2);border:1px solid var(--line);font-size:1.1rem;font-weight:800}
.step button:disabled{opacity:.25}
.step .bar{height:12px}
.step b{width:26px;text-align:center}
.stats{display:flex;gap:6px;font-size:.78rem;grid-column:2;margin-top:-2px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{min-width:46px;height:38px;padding:0 10px;border-radius:12px;background:var(--card2);border:1px solid var(--line);font-size:1rem;display:grid;place-items:center}
.chip.on{background:var(--accent);border-color:var(--accent)}
.chip:disabled{opacity:.3}
.left{font-weight:900;font-size:1.3rem} .left.ok{color:var(--good)}
.go{width:100%;height:54px;border-radius:16px;background:linear-gradient(180deg,#9b8cff,#6d5cf0);font-size:1.6rem;font-weight:800;box-shadow:0 6px 18px -6px #6d5cf0}
.go:disabled{opacity:.35;box-shadow:none}
/* battle */
.clash{display:grid;grid-template-columns:1fr 54px 1fr;align-items:start;text-align:center;min-height:150px}
.clash .side{display:flex;flex-direction:column;align-items:center;gap:6px}
.mid{align-self:center;font-size:2.2rem;font-weight:900}
.mid.adv{color:var(--good)} .mid.res{color:var(--bad)} .mid.same{color:var(--dim)}
.dmg{font-size:1.5rem;font-weight:900;color:var(--bad);animation:pop .5s}
.dmg.z{color:var(--dim);font-size:1.1rem}
@keyframes pop{0%{transform:scale(.4);opacity:0}60%{transform:scale(1.3)}100%{transform:scale(1);opacity:1}}
.orb.hit{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.sub{font-size:.85rem;color:var(--dim);min-height:1.2em}
.int{width:54px;height:54px;border-radius:50%;background:var(--card2);border:2px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.int .d{font-size:.55rem;letter-spacing:1px;color:var(--text)} .int .c{font-size:.7rem;color:var(--warn)}
.int.on{border-color:var(--c,#fff);background:#2e3670;box-shadow:0 0 12px -2px var(--c,#fff)}
.int:disabled{opacity:.25}
.fbtn{flex:1;height:48px;border-radius:14px;background:var(--card2);border:2px solid var(--line);font-size:1.4rem;display:grid;place-items:center}
.fbtn.on{border-color:var(--accent);background:#313a7c}
.fbtn:disabled{opacity:.25}
.sum{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:10px 0;font-size:.95rem}
.sum .tag{font-size:.95rem;padding:4px 9px}
.g{color:var(--good)} .r{color:var(--bad)} .w{color:var(--warn)}
.log{display:flex;flex-direction:column;gap:3px;font-size:.88rem}
.log div{display:flex;justify-content:space-between;gap:8px;background:#0004;border-radius:8px;padding:3px 8px}
.modal{position:fixed;inset:0;background:#000c;display:grid;place-items:center;padding:16px;z-index:10}
.modal .card{text-align:center;width:min(340px,100%);margin:0;padding:22px}
.modal .em{font-size:4.2rem}
details summary{cursor:pointer;font-size:.9rem;list-style:none;text-align:center;color:var(--dim)}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;font-size:.82rem;margin-top:8px}

/* ===== motion + interaction ===== */
.bar i.gh{background:#fff9;transition:width .9s ease .5s}
.bar.low{animation:lowp .7s infinite alternate} @keyframes lowp{to{box-shadow:0 0 14px #ff3b5c;filter:brightness(1.3)}}
.avatar.low{border-color:var(--bad);animation:lowp .7s infinite alternate}
.pips i{transition:background .2s,transform .2s}
.pips i.spend{background:var(--warn);animation:blink .45s infinite alternate}
@keyframes blink{to{background:#ff8a3d;transform:scaleY(.55);opacity:.45}}
.pips i.tick{animation:tick .5s}
@keyframes tick{0%,40%,80%{opacity:.15}20%,60%,100%{opacity:1}}
#app{will-change:transform}
.arena{position:relative;overflow:hidden;padding:14px 8px 10px}
.arena .clash{display:grid;grid-template-columns:1fr 50px 1fr;align-items:center;min-height:160px}
.side{display:flex;flex-direction:column;align-items:center;gap:6px}
.ow{position:relative;display:grid;place-items:center;animation:bob 2.4s ease-in-out infinite}
.ow.go{animation:none}
@keyframes bob{50%{transform:translateY(-5px)}}
.orb.big{transform:scale(var(--k,1));transition:transform .2s cubic-bezier(.3,1.6,.5,1),box-shadow .2s,border-color .2s,background .2s;box-shadow:0 0 calc(10px + var(--g,1)*8px) -2px var(--c)}
.orb .fb{position:absolute;right:-6px;bottom:-4px;font-size:1.25rem;background:#0b0e1d;border-radius:50%;width:32px;height:32px;display:grid;place-items:center;border:2px solid var(--line)}
.orb.big{position:relative}
.inf{font-size:.9rem;min-height:1.4em;display:flex;gap:6px;align-items:center;justify-content:center}
.mid{font-size:2.2rem;font-weight:900;text-align:center;min-height:1.2em}
.mid.adv{color:var(--good)} .mid.res{color:var(--bad)} .mid.same{color:var(--dim)}
.fx{position:absolute;inset:0;pointer-events:none}
.fx span,.fx div{position:absolute}
.fl{font-weight:900;font-size:1.8rem;text-shadow:0 2px 6px #000}
.wheel .ln{transition:stroke .25s,stroke-width .25s,opacity .25s;stroke:#5b6399;stroke-width:1.5;opacity:.45}
.wheel .ln.n{opacity:.75}
.wheel .ln.g{stroke:#5ee6a0;stroke-width:3.5;opacity:1;stroke-dasharray:9 6;animation:flow .6s linear infinite}
.wheel .ln.r{stroke:#ff6b7d;stroke-width:3.5;opacity:1;stroke-dasharray:9 6;animation:flow .6s linear infinite}
.wheel .ln.d{opacity:.3}
@keyframes flow{to{stroke-dashoffset:-15}}
.wheel .nd{transition:opacity .2s;cursor:pointer}
.wheel .nd.off{opacity:.28;cursor:not-allowed}
.wheel .nd .c{transition:stroke-width .2s}
.wheel .nd .ring,.wheel .nd .foe{fill:none;opacity:0;transform-box:fill-box;transform-origin:center}
.wheel .nd.sel .ring{opacity:1;animation:ringp 1.1s ease-out infinite}
.wheel .nd.foeon .foe{opacity:.95;stroke:#ff6b7d;stroke-dasharray:5 4;animation:spin 6s linear infinite}
@keyframes ringp{from{transform:scale(1);opacity:.9}to{transform:scale(1.5);opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
.wheel .nd .n{transition:transform .15s cubic-bezier(.3,1.6,.5,1);transform-box:fill-box;transform-origin:center}
.wheel .nd.sel .n{transform:scale(1.12)}
.wheel .nd:active .n{transform:scale(.9)}
/* slider */
.sl{position:relative;padding:6px 14px 0;touch-action:none;margin:4px 0 6px}
.trk{position:relative;height:16px;border-radius:8px;background:#0008;margin:12px 14px 4px}
.trk .fill{position:absolute;left:0;top:0;bottom:0;border-radius:8px;transition:width .12s,background .2s}
.trk .lock{position:absolute;right:0;top:0;bottom:0;background:repeating-linear-gradient(45deg,#ff6b7d33 0 5px,transparent 5px 10px);border-radius:0 8px 8px 0;transition:width .2s}
.trk .nt{position:absolute;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:#fff4}
.th{position:absolute;top:50%;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;display:grid;place-items:center;font-size:.6rem;letter-spacing:1px;font-weight:800;
  background:radial-gradient(circle at 35% 30%,#fff,var(--c));color:#000;box-shadow:0 0 16px var(--c);transition:left .12s cubic-bezier(.3,1.5,.5,1),background .2s,box-shadow .2s;touch-action:none}
.cs{display:flex;justify-content:space-between;margin:14px 6px 0;font-size:.72rem;color:var(--warn)}
.cs span{width:36px;text-align:center;transition:opacity .2s}
.cs span.x{opacity:.25;text-decoration:line-through}
.sl.off{opacity:.3;pointer-events:none}
.fbtn{transition:transform .12s cubic-bezier(.3,1.6,.5,1),border-color .15s,background .15s} .fbtn.on{transform:translateY(-3px) scale(1.06)}
.fbtn:active{transform:scale(.92)}
.sum{min-height:34px}
.go{position:relative;touch-action:none;transition:transform .15s,box-shadow .2s,opacity .2s;overflow:hidden}
.go:active{transform:scale(.97)}
.go.busy{opacity:.35;pointer-events:none}
.go .up{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-size:1rem;opacity:.6;animation:upb 1.2s infinite}
@keyframes upb{50%{transform:translateY(-70%);opacity:1}}
.swipe-hint{touch-action:pan-y}
.alloc{padding:11px 0;flex:1;touch-action:pan-y;cursor:ew-resize}
.alloc .bar{height:14px}
.pop{animation:popin .35s cubic-bezier(.3,1.6,.5,1)}
@keyframes popin{from{transform:scale(.6);opacity:0}}
.modal .card{animation:popin .4s cubic-bezier(.3,1.6,.5,1)}
.modal .em{display:inline-block;animation:bob 1.6s ease-in-out infinite}
.stats .tag{transition:background .2s}
.flash{animation:fl .5s}
@keyframes fl{30%{background:#fff3}}

/* ===== fit one screen ===== */
html,body{height:100%;overflow:hidden}
body{height:100vh;height:100dvh;overscroll-behavior:none}
.wrap{height:100vh;height:100dvh;display:flex;flex-direction:column;padding:8px 10px calc(8px + env(safe-area-inset-bottom))}
header{margin-bottom:6px;flex:none;gap:8px}
.help{width:30px;height:30px;border-radius:50%;background:var(--card);border:1px solid var(--line);font-size:.9rem}
.logo{font-size:.8rem;flex:1}
.ladder span{width:26px;height:26px;font-size:.85rem}
#app{flex:1;min-height:0;display:flex;flex-direction:column;gap:6px}
#app>.card{margin:0;padding:8px 10px;flex:none}
#app>.card.grow{flex:1 1 0;min-height:0;display:flex;flex-direction:column;gap:6px}
.wheelbox{flex:1 1 0;min-height:60px;display:flex}
.wheelbox .wheel{height:100%;width:100%;max-width:none;margin:0}
.avatar.sm{width:38px;height:38px;font-size:1.4rem;border-radius:12px;border-width:2px}
.arena{padding:8px 8px 6px!important}
.ftrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ft{display:flex;align-items:center;gap:6px}
.ft .fighter{gap:5px;min-width:0}
.ft .bar{height:15px}
.ft .pips{gap:2px}.ft .pips i{flex:1;width:auto;height:7px}
.arena .clash{min-height:0;margin-top:4px;grid-template-columns:1fr 44px 1fr}
.orb.big{width:62px;height:62px;font-size:1.9rem}
.orb .fb{width:26px;height:26px;font-size:1rem;right:-8px;bottom:-4px}
.side{gap:3px}.inf{min-height:1em}
.hist{font-size:.8rem;min-height:1.1rem;justify-content:center}
.mid{font-size:1.8rem}
.brow{padding:2px 0;grid-template-columns:34px 1fr;gap:0 8px}
.brow .orb{width:34px;height:34px;font-size:1.1rem}
.stats{font-size:.68rem;gap:8px;margin-top:-1px;color:var(--dim)}
.step button{width:30px;height:30px}
.alloc{padding:8px 0}
.chip{min-width:34px;height:30px;padding:0 6px;font-size:.78rem}
.left{font-size:1.1rem}
.sl{margin:0;padding:0 8px}
.trk{margin:6px 14px 0}
.th{width:36px;height:36px;margin:-18px 0 0 -18px}
.cs{margin:8px 6px 0;font-size:.68rem}
.fbtn{height:40px;font-size:1.25rem}
.sum{margin:0;min-height:26px;gap:5px}.sum .tag{font-size:.82rem;padding:2px 7px}
.go{height:46px;font-size:1.4rem;flex:none}

/* ===== real-time fighter ===== */
.stage{position:relative;overflow:hidden;padding:0!important;flex:1.15 1 0!important;min-height:180px;display:block!important}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hud{position:absolute;left:0;right:0;top:0;display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:8px 10px;pointer-events:none;z-index:2}
.hud .nm{font-size:.68rem;font-weight:800;letter-spacing:.08em;color:#fff;opacity:.9;display:flex;gap:6px;margin-bottom:3px;text-shadow:0 1px 3px #000}
.hud .e .nm{justify-content:flex-end}
.hud .bar{height:15px;border:1px solid #fff3}
.hud .e .bar i{left:auto;right:0}
.hud .en{height:7px;border-radius:4px;background:#0009;overflow:hidden;position:relative;margin-top:4px;border:1px solid #fff2}
.hud .en i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#ffb830,#ffe27a)}
.hud .en::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 calc(10% - 2px),#0b0e1d calc(10% - 2px) 10%)}
.hud .e .en i{left:auto;right:0}
.hud .en.deny{animation:deny .3s}
@keyframes deny{30%{box-shadow:0 0 0 2px var(--bad)}}
.moves{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;flex:none}
.mv{height:64px;border-radius:14px;background:linear-gradient(180deg,#2c3470,#1d2350);border:2px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;touch-action:manipulation;position:relative;overflow:hidden;transition:transform .08s,opacity .15s,filter .15s}
.mv .ic{font-size:1.5rem;line-height:1.1}.mv .rg{font-size:.62rem;color:var(--dim);line-height:1}.mv .cc{font-size:.7rem;color:var(--warn);line-height:1.1}
.mv:active,.mv.press{transform:scale(.92);border-color:var(--accent)}
.mv.no{opacity:.32}
.mv.busy{filter:saturate(.35) brightness(.75)}
.wheel.cd .nd.sel .ring{animation:none;opacity:.35;stroke:#8f98cf!important}
#ctl .sl{flex:none}

.hud .en .sp{background:repeating-linear-gradient(45deg,#ff6b7d,#ff6b7d 4px,#ffb0ba 4px,#ffb0ba 8px)!important;animation:blink .5s infinite alternate;z-index:1}
.hud .en .fi{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#ffb830,#ffe27a)}
.hud .e .en .fi{left:auto;right:0}
.hud .hs{display:flex;gap:2px;font-size:.72rem;margin-top:3px;min-height:1.1rem;opacity:.95;text-shadow:0 1px 2px #000}
.hud .e .hs{justify-content:flex-end}
.tn{position:absolute;left:50%;top:6px;transform:translateX(-50%);font-size:.62rem;letter-spacing:.14em;font-weight:800;color:#fff;opacity:.75;text-shadow:0 1px 3px #000;z-index:3;pointer-events:none}
.mv.sel{border-color:var(--accent);background:linear-gradient(180deg,#4a3fd0,#2c2a8c);box-shadow:0 0 14px -2px var(--accent);transform:translateY(-3px)}
.go.busy{opacity:.3;pointer-events:none}
.sl.off{opacity:.25;pointer-events:none}
.mv{height:58px}
.ab{display:flex;gap:5px;align-items:center;justify-content:center;font-size:.8rem;min-height:20px;flex:none;color:#fff;white-space:nowrap}
.ab.dim{opacity:.45}
</style>
</head>
<body>
<div class="wrap">
  <header><div class="logo">🔥🌿🪨⚡💧</div><button class="help" data-a="help">❔</button><div class="ladder" id="ladder"></div></header>
  <div id="app"></div>
</div>
<div id="modal"></div>

<script>
/* ======================= ENGINE (real-time duel) ======================= */
const ORDER=['fire','nature','stone','storm','water'];
const EL={
  fire:{name:'Fire',icon:'🔥',color:'#ff7043'},
  nature:{name:'Nature',icon:'🌿',color:'#66bb6a'},
  stone:{name:'Stone',icon:'🪨',color:'#c2a77d'},
  storm:{name:'Storm',icon:'⚡',color:'#fdd835'},
  water:{name:'Water',icon:'💧',color:'#42a5f5'}
};
const TRAIT={fire:'🩸',water:'🐌',nature:'💚',storm:'💨',stone:'⛰️'};
const SIG={fire:{icon:'🫠',name:'Melt'},water:{icon:'🔱',name:'Pierce'},storm:{icon:'🕊️',name:'Fly'},nature:{icon:'🌱',name:'Root'},stone:{icon:'🧱',name:'Wall'}};
const SIG_MIN=4;
const sigOn=(f,el)=>f.build[el]>=SIG_MIN;
const POOL=20,MAXHP=100,MAXEN=10,REGEN=1.25,BASE=2.3,REACH=14,PROJ_HIT=7;
const MOVES={
  bolt:   {icon:'🏹',wind:.38,rec:.30,mult:.85,extra:0,stun:.30},
  rush:   {icon:'⚔️',wind:.12,rec:.55,mult:1.30,extra:0,spd:240,stun:.45},
  slam:   {icon:'💥',wind:.80,rec:.95,mult:2.40,extra:1,spd:160,stun:.80},
  counter:{icon:'🛡️',wind:.04,win:.70,rec:.70,mult:1.20,extra:0},
  focus:  {icon:'🧘',chan:.90,rec:.10,extra:0}
};
const idx=e=>ORDER.indexOf(e);
function beats(a,b){const d=(idx(b)-idx(a)+5)%5;return d===1||d===2}
function relation(a,b){if(a===b)return'same';return beats(a,b)?'adv':'res'}
const power   =p=>0.72+0.55*Math.pow(Math.min(p,30)/20,1.3);
const discount=p=>p>=14?1:0;
const critChance=p=>0.05+0.2*Math.min(p/20,1.2);
const rank=p=>p>=16?'Master':p>=10?'Expert':p>=5?'Adept':p>=1?'Novice':'—';
const TYPE_MULT={adv:1.6,same:1,res:.4};
const tr=(f,el)=>Math.min(1,f.build[el]/16);           /* element trait strength */
function mkBuild(o){const b={};ORDER.forEach(e=>b[e]=o[e]||0);return b}
function mkFighter(name,build,side){
  const el=ORDER.reduce((a,e)=>build[e]>build[a]?e:a,ORDER[0]);

    else if(e.type==='fly'){const f=S.f[e.side];addText(f.x,'🕊️','#fff',20,-10)}
    else if(e.type==='root'){const f=S.f[e.side];spark(f.x,'#66bb6a',12,'🌿');addText(f.x,'🌱 ROOTED','#8fe08f',15,-34)}
    else if(e.type==='cast'){const f=S.f[e.side];if(e.move==='slam')addText(f.x,'⚠','#ff6b7d',22,-10);if(e.side===0)buzz(6)}
    else if(e.type==='swap'){const f=S.f[e.side];FXS.push({x:GX(f.x),y:GY-60*FS,ring:true,l:.45,m:.45,c:EL[e.el].color,r:10})}
    else if(e.type==='ko'){banner={t:0,txt:[e.winner<0?'DRAW':'K.O.!']};buzz(e.winner===0?[40,40,40,40,80]:200)}
  }
  S.ev.length=0;
}
function frame(ts){
  const dt=Math.min(.05,(ts-lastTs)/1000);lastTs=ts;UT+=dt;
  if(phase==='intro'){introT-=dt;if(introT<=0){phase='choose';syncCtl(true)}}
  else if(phase==='exec'&&!paused){
    let sc=1;if(S.lock<=0)for(const f of S.f)if(f.state==='wind'&&f.cur&&f.cur.type==='bolt')sc=.5;
    acc+=dt*sc;let n=0;trails(dt);
    while(acc>=1/60&&n++<6){
      step(S,1/60,rngf);handleEvents();acc-=1/60;
      if(S.over){phase='over';break}
      if(settled(S)&&S.t>.05){endTurn(S);phase='gap';gapT=.4;acc=0;break}
    }
  }else if(phase==='gap'){gapT-=dt;if(gapT<=0){phase='choose';syncCtl(true)}}
  if(S.over){koT+=dt;if(koT>2&&!finished){finished=true;finish()}}
  render(dt);syncHud();syncCtl(false);
}
function render(dt){
  cx.setTransform(1,0,0,1,0,0);cx.drawImage(bg,0,0);cx.setTransform(...TF);
  cx.save();
  if(shakeT>0){shakeT-=dt;cx.translate((Math.random()-.5)*Math.min(.3,shakeT)*34,(Math.random()-.5)*Math.min(.3,shakeT)*24)}
  /* element glow on the ground */
  S.f.forEach(f=>glow(GX(f.x),GY,70*FS,hiddenFor(f)?'#8f98cf':EL[f.el].color,.18));
  S.walls.forEach(drawWall);
  /* draw the one further from centre first */
  const order=[S.f[0],S.f[1]];
  order.forEach(f=>drawFighter(f,dt));
  drawBeams(dt);
  /* fx */
  for(const p of FXS){
    p.l-=dt;if(p.l<=0)continue;const a=p.l/p.m;
    if(p.ring){const r=p.r+(1-a)*(p.ell?90:46);cx.strokeStyle=p.c;cx.globalAlpha=a;cx.lineWidth=4*a+1;cx.beginPath();if(p.ell)cx.ellipse(p.x,p.y,r,r*.22,0,0,7);else cx.arc(p.x,p.y,r,0,7);cx.stroke();cx.globalAlpha=1;continue}
    if(p.puff){const r=p.r*(1+(1-a)*1.6);cx.globalAlpha=a*.6;cx.fillStyle=p.c;cx.beginPath();cx.arc(p.x,p.y-(1-a)*14,r,0,7);cx.fill();cx.globalAlpha=1;continue}
    if(p.line){const len=p.len*(1-a*.3);cx.strokeStyle=p.c;cx.globalAlpha=a;cx.lineWidth=2.5;cx.lineCap='round';cx.beginPath();cx.moveTo(p.x+Math.cos(p.a)*len*.3,p.y+Math.sin(p.a)*len*.3);cx.lineTo(p.x+Math.cos(p.a)*len,p.y+Math.sin(p.a)*len);cx.stroke();cx.globalAlpha=1;continue}
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=260*dt*(p.g===undefined?1:p.g);
    if(p.e){cx.globalAlpha=a;cx.font=`${10+p.s*3}px ${EMF}`;cx.textAlign='center';cx.fillText(p.e,p.x,p.y);cx.globalAlpha=1}
    else{cx.globalAlpha=a;cx.fillStyle=p.c;cx.beginPath();cx.arc(p.x,p.y,p.s*a+.5,0,7);cx.fill();cx.globalAlpha=1}
  }
  FXS=FXS.filter(p=>p.l>0);
  for(const t of TXT){
    t.t+=dt;const a=Math.max(0,1-t.t/1.1),sc=t.t<.12?1+(.12-t.t)*8:1;
    cx.save();cx.translate(t.x,t.y-t.t*42);cx.scale(sc,sc);cx.globalAlpha=a;cx.textAlign='center';cx.textBaseline='middle';
    cx.font=`900 ${t.size}px system-ui,sans-serif`;cx.lineWidth=4;cx.strokeStyle='#000c';cx.strokeText(t.txt,0,0);cx.fillStyle=t.col;cx.fillText(t.txt,0,0);cx.restore();
  }
  TXT=TXT.filter(t=>t.t<1.1);
  cx.restore();
  if(flashT>0){flashT-=dt;cx.fillStyle=`rgba(255,255,255,${Math.max(0,flashT*3)})`;cx.fillRect(0,0,CW,CH)}
  /* banner */
  if(banner){
    banner.t+=dt;const seq=banner.txt,dur=seq.length>1?.8:1.6,i=Math.min(seq.length-1,Math.floor(banner.t/dur)),lt=banner.t-i*dur;
    if(banner.t<dur*seq.length+.2){
      const sc=1+Math.max(0,.25-lt)*5,a=lt>dur-.2?Math.max(0,(dur-lt)/.2):1;
      cx.save();cx.translate(180,CH*.42);cx.scale(sc,sc);cx.globalAlpha=a;cx.textAlign='center';cx.textBaseline='middle';
      const big=seq[i]==='K.O.!';cx.font=`900 ${big?64:46}px Impact,system-ui,sans-serif`;
      const g=cx.createLinearGradient(0,-26,0,26);g.addColorStop(0,'#fff6b0');g.addColorStop(.5,'#ffc933');g.addColorStop(1,'#e0541d');
      cx.lineWidth=8;cx.strokeStyle='#2a0a00';cx.lineJoin='round';cx.strokeText(seq[i],0,0);cx.fillStyle=g;cx.fillText(seq[i],0,0);cx.restore();
    }else if(!S.over)banner=null;
  }
}

/* ---------- HUD + controls sync ---------- */
const SIGTXT={fire:'melts 🧱 🛡️',water:'pierces 🧱 🛡️ 🏹',storm:'dash flies over 🧱 🏹',nature:'hit → foe rooted',stone:'🛡️ raises a wall'};
const effInt=(P,type,el)=>{let i=G.sel.int;while(i>1&&costOf(P,type,i,el)>P.energy)i--;return i};
function setBar(k,f){
  const bar=$('#hp'+k),w=Math.max(0,Math.round(f.hp));if(hudC['h'+k]===w)return;hudC['h'+k]=w;
  bar.querySelector('.fl').style.width=w+'%';bar.querySelector('.gh').style.width=w+'%';
  bar.querySelector('b').textContent='❤️ '+w;bar.classList.toggle('low',w<30&&w>0);
}
function syncHud(){
  const[P,E]=S.f;setBar('P',P);setBar('E',E);
  const cost=phase==='choose'?costOf(P,G.plan.type,effInt(P,G.plan.type,P.el),P.el):0;
  [['P',P],['E',E]].forEach(([k,f])=>{const w=(f.energy/MAXEN*100).toFixed(1);if(hudC['e'+k]!==w){hudC['e'+k]=w;$('#en'+k).querySelector('.fi').style.width=w+'%'}});
  const sp=$('#enP .sp'),sk=cost+'|'+P.energy;if(hudC.sp!==sk){hudC.sp=sk;sp.style.left=Math.max(0,(P.energy-cost)/MAXEN*100)+'%';sp.style.width=(Math.min(cost,P.energy)/MAXEN*100)+'%'}
  const hk=S.hist[0].length;if(hudC.hk!==hk){hudC.hk=hk;
    const f=h=>h.slice(-5).map(m=>`<span>${EL[m.el].icon}${MOVES[m.type].icon}</span>`).join('');
    $('#hsP').innerHTML=f(S.hist[0]);$('#hsE').innerHTML=f(S.hist[1])}
  const tn='TURN '+S.turn;if(hudC.tn!==tn){hudC.tn=tn;$('#tn').textContent=tn}
}
function syncCtl(force){
  const P=S.f[0],E=S.f[1],ch=phase==='choose';
  if(ch&&G.plan.type!=='focus'&&costOf(P,G.plan.type,1,P.el)>P.energy)G.plan.type='focus';
  if(ch&&P.root&&P.lastEl&&P.build[P.lastEl]>0)P.el=P.lastEl;
  const key=[P.el,P.root,S.walls.length,phase,G.plan.type,G.sel.int,Math.floor(P.energy*2),(phase==='exec'||phase==='gap'||phase==='over')?E.el:'-'].join('|');
  if(!force&&key===hudC.k)return;hudC.k=key;
  updWheel(P.el,P.build,'el',ch||phase==='intro'?null:E.el);
  if(P.root)document.querySelectorAll('.wheel .nd').forEach(n=>n.classList.toggle('off',n.dataset.e!==P.el));
  const ab=$('#ab'),on=P.build[P.el]>=SIG_MIN;ab.className='ab'+(on?'':' dim');
  ab.innerHTML=P.root?`🌱 <b>rooted</b> · 🔒 ${EL[P.el].icon} · 🐢⚔️`:`${EL[P.el].icon} ${SIG[P.el].icon} ${SIGTXT[P.el]}${on?'':' · 🔒4✦'}`;
  const col=EL[P.el].color,th=$('#th'),sl=$('#sl'),pc=(G.sel.int-1)*25;
  sl.style.setProperty('--c',col);th.style.left=pc+'%';th.textContent=G.sel.int;th.style.setProperty('--c',col);th.style.transform=`scale(${.8+.08*G.sel.int})`;
  sl.classList.toggle('off',G.plan.type==='focus');
  const fill=sl.querySelector('.fill');fill.style.width=pc+'%';fill.style.background=`linear-gradient(90deg,${col}55,${col})`;
  document.querySelectorAll('.mv').forEach(b=>{const m=b.dataset.mv,c=costOf(P,m,effInt(P,m,P.el),P.el),c1=costOf(P,m,1,P.el);
    b.querySelector('.cc').textContent=m==='focus'?'+3⚡':'⚡'+c;b.classList.toggle('no',c1>P.energy);b.classList.toggle('busy',!ch);b.classList.toggle('sel',m===G.plan.type)});
  const go=$('#go'),t=G.plan.type,c=costOf(P,t,effInt(P,t,P.el),P.el);
  go.classList.toggle('busy',!ch);go.style.background=`linear-gradient(180deg,${col},color-mix(in srgb,${col} 55%,#000))`;
  $('#gotxt').textContent=(t==='focus'?'':EL[P.el].icon+' ')+MOVES[t].icon+(t==='focus'?'':'  ⚡'+c);
}
function cycleEl(d){
  if(!S||phase!=='choose')return;const P=S.f[0],av=ORDER.filter(e=>P.build[e]>0);if(av.length<2)return;
  const i=av.indexOf(P.el);doSwap(av[(i+d+av.length)%av.length]);
}
function doSwap(el){
  if(!S||phase!=='choose'||S.f[0].build[el]<=0)return;
  if(S.f[0].root){A($('#wh'),[{transform:'translateX(-5px)'},{transform:'translateX(5px)'},{transform:'none'}],{duration:180});buzz(30);return}
  if(S.f[0].el!==el){S.f[0].el=el;buzz(8);syncCtl(true)}
}
function selectMove(type){
  if(!S||phase!=='choose')return;const P=S.f[0];
  if(costOf(P,type,1,P.el)>P.energy){const e=$('#enP');e.classList.remove('deny');void e.offsetWidth;e.classList.add('deny');buzz(40);return}
  G.plan.type=type;buzz(6);syncCtl(true);
}
function lockTurn(){
  if(!S||phase!=='choose')return;
  const P=S.f[0],E=S.f[1],t=G.plan.type;
  const mp={type:t,el:P.el,int:effInt(P,t,P.el)};
  const me=aiChoose(S,E,ENEMIES[G.level].ai,rngf);
  beginTurn(S,[mp,me],rngf);S.lock=.6;phase='exec';acc=0;buzz(14);syncCtl(true);
}
function setupGo(){
  const go=$('#go');let sy=null;
  go.addEventListener('pointerdown',e=>{sy=e.clientY;go.setPointerCapture(e.pointerId)});
  go.addEventListener('pointermove',e=>{if(sy===null||phase!=='choose')return;const dy=Math.min(0,e.clientY-sy);go.style.transform=`translateY(${dy*.6}px) scale(${1+Math.abs(dy)/400})`});
  go.addEventListener('pointerup',e=>{if(sy===null)return;const dy=e.clientY-sy;sy=null;go.style.transform='';if(dy<-40){suppress=Date.now();lockTurn()}});
  go.addEventListener('pointercancel',()=>{sy=null;go.style.transform=''});
}
function setupSlider(){
  const sl=$('#sl'),trk=$('#trk');let drag=false;
  const at=e=>{const r=trk.getBoundingClientRect();const i=Math.round(Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))*4)+1;
    if(i!==G.sel.int&&phase==='choose'){G.sel.int=i;buzz(6);if(S)syncCtl(true)}};
  sl.addEventListener('pointerdown',e=>{drag=true;sl.setPointerCapture(e.pointerId);at(e)});
  sl.addEventListener('pointermove',e=>{if(drag)at(e)});
  const up=()=>{drag=false};sl.addEventListener('pointerup',up);sl.addEventListener('pointercancel',up);
}
function showHelp(){
  paused=true;
  $('#modal').innerHTML=`<div class="modal" data-a="closeh"><div class="card"><div class="legend" style="font-size:.88rem;text-align:left;grid-template-columns:auto 1fr;gap:6px 10px">
    <b>1️⃣ pick</b><span>move · element · ● power — secret. then ▶ (or flick ⬆). both play out at once</span>
    <b>🏹 ↠</b><span class="g">▲</span><span></span><span>beats 💥 🛡️ 🧘 · trades with ⚔️</span>
    <b>⚔️ →</b><span>beats 🏹 💥 🧘 · <span class="r">▼</span> 🛡️ parries it</span>
    <b>💥 ⤓</b><span>huge, slow. beats 🛡️ 🧘 · <span class="r">▼</span> cut down by 🏹 ⚔️</span>
    <b>🛡️ ◈</b><span>beats ⚔️ (riposte) · <span class="r">▼</span> 🏹 💥 go through</span>
    <b>🧘 ◌</b><span>skip & recharge +3⚡ · <span class="r">▼</span> exposed to everything</span>
    <b>🔥🫠</b><span>Melt — burns through 🧱 walls &amp; 🛡️ guards. burn</span>
    <b>💧🔱</b><span>Pierce — passes 🧱 🛡️ and other shots, can't be reflected. drench</span>
    <b>⚡🕊️</b><span>Fly — ⚔️💥 dashes go over 🧱 and 🏹. fast</span>
    <b>🌿🌱</b><span>Root — hit locks their element next turn &amp; slows their dash. leech</span>
    <b>🪨🧱</b><span>Wall — 🛡️ raises a wall for 2 turns: blocks 🏹⚔️💥. tough</span>
    <b>🔒</b><span>abilities unlock at 4✦ in that element; stronger with more</span>
    <b>▲ ▼</b><span>your element beats theirs <span class="g">×1.6</span> · loses <span class="r">×0.4</span>. read their habits (history under bars)</span></div></div></div>`;
}
function finish(){
  const P=S.f[0],E=S.f[1];let em,btn,a;
  if(S.winner<0){em='⚖️';btn='↻';a='retry'}
  else if(S.winner===1){em='💀';btn='↻';a='retry'}
  else if(G.level>=ENEMIES.length-1){em='🏆';btn='↻';a='restart'}
  else{em='✨';btn='▶ '+ENEMIES[G.level+1].av;a='next'}
  $('#modal').innerHTML=`<div class="modal"><div class="card"><div class="em">${em}</div>${S.winner===0?`<div style="margin:6px 0 14px">❤️ ${Math.round(P.hp)} · ⏱ ${S.turn-1}</div>`:'<div style="height:14px"></div>'}<button class="go" data-a="${a}">${btn}</button></div></div>`;
}

/* ---------- events ---------- */
document.addEventListener('click',ev=>{
  if(Date.now()-suppress<350)return;
  const t=ev.target.closest('[data-a]');if(!t||t.disabled)return;
  const a=t.dataset.a;
  if(a==='focus'){G.focus=t.dataset.e;updBuild();buzz(8)}
  else if(a==='preset')preset(t.dataset.v);
  else if(a==='start'&&pts(G.build)===POOL)renderBattle();
  else if(a==='el')doSwap(t.dataset.e);
  else if(a==='go')lockTurn();
  else if(a==='help')showHelp();
  else if(a==='closeh'){$('#modal').innerHTML='';paused=false}
  else if(a==='retry'||a==='next'||a==='restart'){
    $('#modal').innerHTML='';
    if(a==='next')G.level++;
    if(a==='restart'){G.level=0;G.build=mkBuild({fire:10,water:10})}
    renderBuild();window.scrollTo(0,0);
  }
});
let holdT=null;
document.addEventListener('pointerdown',ev=>{
  const mvb=ev.target.closest('[data-mv]');
  if(mvb){selectMove(mvb.dataset.mv);mvb.classList.add('press');setTimeout(()=>mvb.classList.remove('press'),110);return}
  const h=ev.target.closest('[data-hold]');
  if(h&&!h.disabled){const e=h.dataset.e,d=+h.dataset.hold;const stepf=()=>setPts(e,G.build[e]+d);stepf();
    holdT=setTimeout(function rep(){stepf();holdT=setTimeout(rep,85)},360);return}
  const al=ev.target.closest('.alloc');
  if(al){const e=al.dataset.e;al.setPointerCapture(ev.pointerId);
    const mv=x=>{const r=al.getBoundingClientRect();setPts(e,Math.round(Math.max(0,Math.min(1,(x-r.left)/r.width))*POOL))};
    mv(ev.clientX);const m=q=>mv(q.clientX),u=()=>{al.removeEventListener('pointermove',m);al.removeEventListener('pointerup',u);al.removeEventListener('pointercancel',u)};
    al.addEventListener('pointermove',m);al.addEventListener('pointerup',u);al.addEventListener('pointercancel',u)}
});
['pointerup','pointercancel','pointerleave'].forEach(t=>document.addEventListener(t,()=>{clearTimeout(holdT)},true));
document.addEventListener('keydown',e=>{
  if(G.screen!=='battle'||!S)return;
  const k={'1':'bolt','2':'rush','3':'slam','4':'counter','5':'focus'}[e.key];
  if(k)selectMove(k);
  else if(e.key==='Enter'||e.key===' '){e.preventDefault();lockTurn()}
  else if(e.key==='ArrowLeft')cycleEl(-1);else if(e.key==='ArrowRight')cycleEl(1);
  else if(e.key==='ArrowUp'&&phase==='choose'){G.sel.int=Math.min(5,G.sel.int+1);syncCtl(true)}else if(e.key==='ArrowDown'&&phase==='choose'){G.sel.int=Math.max(1,G.sel.int-1);syncCtl(true)}
});
document.addEventListener('visibilitychange',()=>{lastTs=performance.now()});
renderBuild();
window.__g={G,renderBuild,get S(){return S},get phase(){return phase}};
}
</script>
