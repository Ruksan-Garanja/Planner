<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Elemental Duel</title>
<style>
:root{
  --bg:#0b0e1d; --bg2:#141936; --card:#1a2040; --card2:#232a55; --line:#343b70;
  --text:#eef0ff; --dim:#8f98cf; --good:#5ee6a0; --bad:#ff6b7d; --warn:#ffd166; --accent:#8b7bff;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:#0b0e1d}html,body{margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--text);
  background:radial-gradient(900px 600px at 50% -10%,#262e6e 0%,var(--bg) 65%) fixed;min-height:100vh;user-select:none}
.wrap{max-width:520px;margin:0 auto;padding:12px 12px 40px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:disabled{cursor:not-allowed}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.logo{font-weight:900;letter-spacing:.12em;font-size:.95rem}
.ladder{display:flex;gap:6px}
.ladder span{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:1rem;background:var(--card);border:2px solid var(--line);filter:grayscale(1) opacity(.5)}
.ladder span.done{filter:none;border-color:var(--good)} .ladder span.cur{filter:none;border-color:var(--warn);box-shadow:0 0 10px var(--warn)}
.card{background:linear-gradient(180deg,var(--card),var(--bg2));border:1px solid var(--line);border-radius:18px;padding:12px;margin-bottom:10px}
.dim{color:var(--dim)}
.row{display:flex;align-items:center;gap:8px}
.sp{flex:1}
.orb{--c:#fff;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:1.4rem;
  background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--c) 55%,#fff 0%),color-mix(in srgb,var(--c) 18%,#000) 75%);
  border:2px solid var(--c);box-shadow:0 0 14px -3px var(--c);flex:none}
.orb.big{width:84px;height:84px;font-size:2.6rem}
.avatar{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;font-size:2rem;background:#0006;border:2px solid var(--line);flex:none}
/* bars */
.bar{flex:1;height:16px;border-radius:9px;background:#0008;overflow:hidden;position:relative}
.bar i{display:block;height:100%;border-radius:9px;transition:width .5s}
.bar.hp i{background:linear-gradient(90deg,#d9435a,#ff8a6b)} .bar.hp.you i{background:linear-gradient(90deg,#2ec27e,#7bf3b9)}
.bar b{position:absolute;inset:0;display:grid;place-items:center;font-size:.72rem;text-shadow:0 1px 2px #000}
.pips{display:flex;gap:3px} .pips i{width:15px;height:10px;border-radius:3px;background:#0008}
.pips i.on{background:var(--warn);box-shadow:0 0 6px #ffd16688}
.hist{display:flex;gap:2px;font-size:.95rem;min-height:1.3rem}
.tag{display:inline-flex;gap:3px;align-items:center;background:#0006;border-radius:8px;padding:2px 7px;font-size:.78rem;white-space:nowrap}
.stars{color:var(--warn);letter-spacing:-1px;font-size:.7rem}
.fighter{display:flex;flex-direction:column;gap:7px}
/* wheel */
.wheel{display:block;width:100%;max-width:340px;margin:0 auto;touch-action:manipulation}
.wheel g[data-a]{cursor:pointer}
.wheel .n{transition:transform .12s;transform-box:fill-box;transform-origin:center}
.wheel g[data-a]:active .n{transform:scale(.92)}
/* build */
.brow{display:grid;grid-template-columns:44px 1fr;gap:6px 10px;align-items:center;padding:6px 0}
.step{display:flex;align-items:center;gap:6px}
.step button{width:34px;height:34px;border-radius:10px;background:var(--card2);border:1px solid var(--line);font-size:1.1rem;font-weight:800}
.step button:disabled{opacity:.25}
.step .bar{height:12px}
.step b{width:26px;text-align:center}
.stats{display:flex;gap:6px;font-size:.78rem;grid-column:2;margin-top:-2px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{min-width:38px;height:36px;padding:0 7px;font-size:.85rem;border-radius:12px;background:var(--card2);border:1px solid var(--line);font-size:1rem;display:grid;place-items:center}
.chip.on{background:var(--accent);border-color:var(--accent)}
.chip:disabled{opacity:.3}
.left{font-weight:900;font-size:1.3rem} .left.ok{color:var(--good)}
.go{width:100%;height:54px;border-radius:16px;background:linear-gradient(180deg,#9b8cff,#6d5cf0);font-size:1.6rem;font-weight:800;box-shadow:0 6px 18px -6px #6d5cf0}
.go:disabled{opacity:.35;box-shadow:none}
/* battle */
.clash{display:grid;grid-template-columns:1fr 54px 1fr;align-items:start;text-align:center;min-height:150px}
.clash .side{display:flex;flex-direction:column;align-items:center;gap:6px}
.mid{align-self:center;font-size:2.2rem;font-weight:900}
.mid.adv{color:var(--good)} .mid.res{color:var(--bad)} .mid.same{color:var(--dim)}
.dmg{font-size:1.5rem;font-weight:900;color:var(--bad);animation:pop .5s}
.dmg.z{color:var(--dim);font-size:1.1rem}
@keyframes pop{0%{transform:scale(.4);opacity:0}60%{transform:scale(1.3)}100%{transform:scale(1);opacity:1}}
.orb.hit{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.sub{font-size:.85rem;color:var(--dim);min-height:1.2em}
.int{width:54px;height:54px;border-radius:50%;background:var(--card2);border:2px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.int .d{font-size:.55rem;letter-spacing:1px;color:var(--text)} .int .c{font-size:.7rem;color:var(--warn)}
.int.on{border-color:var(--c,#fff);background:#2e3670;box-shadow:0 0 12px -2px var(--c,#fff)}
.int:disabled{opacity:.25}
.fbtn{flex:1;height:48px;border-radius:14px;background:var(--card2);border:2px solid var(--line);font-size:1.4rem;display:grid;place-items:center}
.fbtn.on{border-color:var(--accent);background:#313a7c}
.fbtn:disabled{opacity:.25}
.sum{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:10px 0;font-size:.95rem}
.sum .tag{font-size:.95rem;padding:4px 9px}
.g{color:var(--good)} .r{color:var(--bad)} .w{color:var(--warn)}
.log{display:flex;flex-direction:column;gap:3px;font-size:.88rem}
.log div{display:flex;justify-content:space-between;gap:8px;background:#0004;border-radius:8px;padding:3px 8px}
.modal{position:fixed;inset:0;background:#000c;display:grid;place-items:center;padding:16px;z-index:10}
.modal .card{text-align:center;width:min(340px,100%);margin:0;padding:22px}
.modal .em{font-size:4.2rem}
details summary{cursor:pointer;font-size:.9rem;list-style:none;text-align:center;color:var(--dim)}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;font-size:.82rem;margin-top:8px}
</style>
</head>
<body>
<div class="wrap">
  <header><div class="logo">🔥🌿🪨⚡💧</div><div class="ladder" id="ladder"></div></header>
  <div id="app"></div>
</div>
<div id="modal"></div>

<script>
/* ======================= ENGINE ======================= */
const ORDER=['fire','nature','stone','storm','water'];
const EL={
  fire:{name:'Fire',icon:'🔥',color:'#ff7043'},
  nature:{name:'Nature',icon:'🌿',color:'#66bb6a'},
  stone:{name:'Stone',icon:'🪨',color:'#c2a77d'},
  storm:{name:'Storm',icon:'⚡',color:'#fdd835'},
  water:{name:'Water',icon:'💧',color:'#42a5f5'}
};
const POOL=20, MAXHP=100, MAXEN=10, REGEN=3, BASE=3.5;
const FORMS={
  strike:{name:'Strike',dmg:1,  extra:0,desc:'Balanced attack.'},
  pierce:{name:"Pierce",dmg:.75, extra:0,desc:'-25% damage, but being resisted hurts less (x0.7 instead of x0.4) and it halves enemy wards.'},
  surge: {name:'Surge', dmg:1.5,extra:1,desc:'+50% damage for +1 energy. If the enemy counters you, you take +25% damage.'},
  ward:  {name:'Ward',  dmg:.3, extra:0,desc:'Weak attack plus a shield of your element. If your element beats theirs the shield is x1.5 and reflects 30%; if it loses, x0.5.'},
  focus: {name:'Focus', dmg:0,  extra:0,desc:'No attack. Recover +4 bonus energy, but you are exposed: +25% damage taken.'}
};
const idx=e=>ORDER.indexOf(e);
function beats(a,b){const d=(idx(b)-idx(a)+5)%5;return d===1||d===2}
function relation(a,b){ if(!b) return 'open'; if(a===b) return 'same'; return beats(a,b)?'adv':'res'; }
/* Mastery: convex curve -> splitting points weakens every element, stacking sharpens one */
const power   =p=>0.6+0.95*Math.pow(Math.min(p,30)/20,1.3);
const discount=p=>p>=12?1:0;
const critChance=p=>0.05+0.25*Math.min(p/20,1.2);
const rank=p=>p>=16?'Master':p>=10?'Expert':p>=5?'Adept':p>=1?'Novice':'—';
const TYPE_MULT={adv:1.6,same:1,res:.4,open:1.25};

function mkBuild(o){const b={};ORDER.forEach(e=>b[e]=o[e]||0);return b}
function mkFighter(name,build){return{name,build,hp:MAXHP,energy:MAXEN,streakEl:null,streak:0,hist:[]}}
function costOf(f,m){
  if(m.form==='focus') return 0;
  return Math.max(1,m.int+FORMS[m.form].extra-discount(f.build[m.el]));
}
function streakBonus(f,m){
  if(m.form==='focus'||f.streakEl!==m.el) return 1;
  const p=f.build[m.el];
  return 1+Math.min(f.streak,3)*0.1*Math.min(1.5,Math.max(.3,p/10));
}
function attackDmg(f,m,rel,crit){
  if(m.form==='focus') return 0;
  let mult=TYPE_MULT[rel];
  if(rel==="res"&&m.form==="pierce") mult=.7;
  return BASE*m.int*power(f.build[m.el])*FORMS[m.form].dmg*mult*streakBonus(f,m)*(crit?1.5:1);
}
function wardShield(f,m,rel){
  if(m.form!=='ward') return 0;
  const k={adv:1.5,same:1,res:.5,open:0}[rel];
  return BASE*1.6*m.int*power(f.build[m.el])*k;
}
function resolve(P,E,mp,me,turn,rng=Math.random){
  const stress=1+0.1*Math.max(0,turn-12);
  const side=(A,m,mo)=>{
    const o={m,dmg:0,shield:0,crit:false,rel:null,streak:streakBonus(A,m)};
    if(m.form==='focus') return o;
    o.rel=relation(m.el,mo.form==='focus'?null:mo.el);
    o.crit=rng()<critChance(A.build[m.el]);
    o.dmg=attackDmg(A,m,o.rel,o.crit)*stress;
    o.shield=wardShield(A,m,o.rel);
    return o;
  };
  const sp=side(P,mp,me), se=side(E,me,mp);
  const incoming=(def,md,atk,ma,sDef,sAtk)=>{
    let d=sAtk.dmg, exposed=false;
    if(md.form==='focus'||(md.form==='surge'&&sDef.rel==='res')){d*=1.25;exposed=true}
    let sh=sDef.shield; if(ma.form==='pierce') sh*=.5;
    const absorbed=Math.min(sh,d); d-=absorbed;
    const reflect=(md.form==='ward'&&sDef.rel==='adv')?absorbed*.3:0;
    return{dmg:d,absorbed,reflect,exposed};
  };
  const toP=incoming(P,mp,E,me,sp,se), toE=incoming(E,me,P,mp,se,sp);
  const dP=Math.round(toP.dmg+toE.reflect), dE=Math.round(toE.dmg+toP.reflect);
  return{sp,se,toP,toE,dP,dE,stress};
}
function endTurn(f,m){
  if(m.form!=='focus'){
    f.streak=(f.streakEl===m.el)?f.streak+1:0; f.streakEl=m.el;
  } else {f.streak=0;f.streakEl=null}
  f.energy=Math.min(MAXEN,f.energy-costOf(f,m)+REGEN+(m.form==='focus'?4:0));
  f.hist.push(m.form==='focus'?null:m.el);
}
function pickW(items,w,rng=Math.random){
  const t=w.reduce((a,b)=>a+b,0); let r=rng()*t;
  for(let i=0;i<items.length;i++){r-=w[i]; if(r<=0) return items[i]}
  return items[items.length-1];
}
/* Enemy brain. prof: {skill:0-1 (read the player), predict:'last'|'freq'|'none', habit:0-1 (repeat own element)} */
function aiChoose(E,P,prof,rng=Math.random){
  if(E.energy<=2&&rng()<.75) return{form:'focus',el:null,int:0};
  let pred=null;
  const ph=P.hist.filter(x=>x);
  if(rng()<prof.skill&&ph.length){
    if(prof.predict==='last') pred=ph[ph.length-1];
    else if(prof.predict==='freq'){
      const rec=P.hist.slice(-6).filter(x=>x), cnt={};
      rec.forEach(x=>cnt[x]=(cnt[x]||0)+1);
      const ks=Object.keys(cnt); if(ks.length) pred=pickW(ks,ks.map(k=>cnt[k]*cnt[k]),rng);
    }
  }
  const els=ORDER.filter(e=>E.build[e]>0);
  const last=E.hist.length?E.hist[E.hist.length-1]:null;
  const w=els.map(e=>{
    let x=Math.pow(power(E.build[e]),1.6);
    if(pred){ if(beats(e,pred)) x*=3; else if(beats(pred,e)) x*=.25; }
    if(last&&e===last&&prof.habit) x*=1+prof.habit*2;
    return x;
  });
  const el=pickW(els,w,rng);
  const lowHp=E.hp<30;
  const fw=[5,2.2,2.4,lowHp?3:1]; const fn=['strike','pierce','surge','ward'];
  if(pred&&beats(pred,el)) fw[1]+=2;
  let form=pickW(fn,fw,rng);
  let int=pickW([1,2,3,4,5],[1,3,4,3,2],rng);
  if(E.energy>=9) int=Math.max(int,3);
  int=Math.min(int,5);
  let m={el,int,form};
  while(costOf(E,m)>E.energy&&m.int>1) m.int--;
  if(costOf(E,m)>E.energy) m.form='strike';
  if(costOf(E,m)>E.energy) return{form:'focus',el:null,int:0};
  return m;
}
/* ======================= (test hook) ======================= */
if(typeof module!=='undefined') module.exports={ORDER,mkBuild,mkFighter,resolve,endTurn,aiChoose,costOf,power,beats,POOL,MAXHP,rng:null};
//#UI
if(typeof document!=='undefined'){
const FI={strike:'⚔️',pierce:'🏹',surge:'💥',ward:'🛡️',focus:'🧘'};
const FCAP={strike:'⚔️ ×1',pierce:'🏹 ×¾ · <span class="r">▼</span> softer · 🛡½',surge:'💥 ×1.5 · ⚡+1 · <span class="r">▼</span> +25% hurt',ward:'🛡️ <span class="g">▲</span>×1.5 <span class="r">▼</span>×½ · ↩30%',focus:'🧘 ⚡+4 · 💔 +25%'};
const ENEMIES=[
  {av:'🐲',name:'Ember',blurb:'',build:mkBuild({fire:15,water:5}),ai:{skill:.2,predict:'last',habit:.5}},
  {av:'🧜‍♀️',name:'Mara',build:mkBuild({water:10,stone:10}),ai:{skill:.4,predict:'last',habit:.2}},
  {av:'🦌',name:'Warden',build:mkBuild({nature:12,storm:8}),ai:{skill:.5,predict:'freq',habit:.2}},
  {av:'🦅',name:'Kei',build:mkBuild({fire:4,nature:4,stone:4,storm:4,water:4}),ai:{skill:.65,predict:'freq',habit:0}},
  {av:'🔮',name:'Sage',build:mkBuild({storm:8,fire:6,stone:6}),ai:{skill:.8,predict:'freq',habit:.05}}
];
const $=s=>document.querySelector(s);
const G={level:0,build:mkBuild({fire:10,water:10}),focus:'fire',P:null,E:null,turn:1,sel:{el:'fire',int:3,form:'strike'},last:null,hist:[],over:false};

const pts=b=>ORDER.reduce((a,e)=>a+b[e],0);
const icons=h=>h.slice(-8).map(x=>`<span>${x?EL[x].icon:'💤'}</span>`).join('');
const stars=p=>{const n=p>=16?4:p>=10?3:p>=5?2:p>=1?1:0;return'★'.repeat(n)+'☆'.repeat(4-n)};
const dots=n=>'●'.repeat(n);
const orb=(e,cls='')=>`<div class="orb ${cls}" style="--c:${EL[e].color}">${EL[e].icon}</div>`;
function ladder(){$('#ladder').innerHTML=ENEMIES.map((e,i)=>`<span class="${i<G.level?'done':i===G.level?'cur':''}">${e.av}</span>`).join('')}

/* element wheel: arrows point from the winner to the loser */
function wheel(sel,act,build){
  const S=300,c=S/2,R=104,r=29;
  const pos=ORDER.map((_,i)=>{const a=(-90+72*i)*Math.PI/180;return[c+R*Math.cos(a),c+R*Math.sin(a)]});
  const si=sel==null?-1:ORDER.indexOf(sel);
  const edges=[];
  for(let i=0;i<5;i++)for(const k of[1,2]){
    const j=(i+k)%5,[x1,y1]=pos[i],[x2,y2]=pos[j];
    const dx=x2-x1,dy=y2-y1,L=Math.hypot(dx,dy),ux=dx/L,uy=dy/L;
    const cls=si<0?'d':i===si?'g':j===si?'r':'d';
    edges.push({cls,l:`<line x1="${x1+ux*(r+3)}" y1="${y1+uy*(r+3)}" x2="${x2-ux*(r+9)}" y2="${y2-uy*(r+9)}" stroke="${{g:'#5ee6a0',r:'#ff6b7d',d:'#5b6399'}[cls]}" stroke-width="${cls==='d'?1.5:3.5}" opacity="${cls==='d'?(si<0?.7:.35):1}" marker-end="url(#m${cls})"/>`});
  }
  const arrows=edges.filter(e=>e.cls==='d').concat(edges.filter(e=>e.cls!=='d')).map(e=>e.l).join('');
  const nodes=ORDER.map((e,i)=>{
    const [x,y]=pos[i],p=build[e],on=!act||p>0,isSel=i===si;
    return`<g ${on&&act?`data-a="${act}" data-e="${e}"`:''} opacity="${on?1:.3}">
      <g class="n"><circle cx="${x}" cy="${y}" r="${r}" fill="${EL[e].color}" fill-opacity=".22" stroke="${EL[e].color}" stroke-width="${isSel?5:2}" ${isSel?`style="filter:drop-shadow(0 0 8px ${EL[e].color})"`:''}/>
      <text x="${x}" y="${y+9}" text-anchor="middle" font-size="27">${EL[e].icon}</text>
      <circle cx="${x+20}" cy="${y+20}" r="11" fill="#0b0e1d" stroke="${EL[e].color}" stroke-width="1.5"/>
      <text x="${x+20}" y="${y+24}" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">${p}</text></g></g>`}).join('');
  const mk=(id,col)=>`<marker id="m${id}" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="${col}"/></marker>`;
  return`<svg class="wheel" viewBox="0 0 ${S} ${S}"><defs>${mk('g','#5ee6a0')}${mk('r','#ff6b7d')}${mk('d','#5b6399')}</defs>${arrows}${nodes}
    <text x="${c}" y="${c-4}" text-anchor="middle" font-size="12" fill="#5ee6a0">▲ →</text><text x="${c}" y="${c+14}" text-anchor="middle" font-size="12" fill="#ff6b7d">▼ ←</text></svg>`;
}
const brain=a=>`🧠<span class="stars">${a.skill<.35?'★☆☆':a.skill<.6?'★★☆':'★★★'}</span>${a.habit>.3?' 🔁':''}`;
const miniBuild=b=>ORDER.filter(e=>b[e]>0).map(e=>`<span class="tag" style="color:${EL[e].color}">${EL[e].icon}<b>${b[e]}</b></span>`).join('');

/* ---------- BUILD ---------- */
function renderBuild(){
  ladder();
  const en=ENEMIES[G.level],left=POOL-pts(G.build);
  $('#app').innerHTML=`
  <div class="card row" style="align-items:center">
    <div class="avatar">${en.av}</div>
    <div class="fighter sp"><div class="row"><span class="dim">${G.level+1}/${ENEMIES.length}</span><b>${en.name}</b><span class="sp"></span><span class="tag">${brain(en.ai)}</span></div>
      <div class="chips">${miniBuild(en.build)}</div></div>
  </div>
  <div class="card">
    <div class="row" style="margin-bottom:6px"><span class="left ${left===0?'ok':''}">✦ ${left}</span><span class="sp"></span>
      <div class="chips">
        <button class="chip" data-a="preset" data-v="1" title="20">◉</button>
        <button class="chip" data-a="preset" data-v="2" title="10/10">◉◉</button>
        <button class="chip" data-a="preset" data-v="3" title="7/7/6">◉◉◉</button>
        <button class="chip" data-a="preset" data-v="5" title="4×5">◎◎◎◎◎</button>
        <button class="chip" data-a="preset" data-v="0" title="clear">↺</button></div></div>
    ${wheel(G.focus,'focus',G.build)}
    ${ORDER.map(e=>{const p=G.build[e];return`
    <div class="brow">
      ${orb(e)}
      <div class="step"><button data-a="dec" data-e="${e}" ${p<=0?'disabled':''}>−</button>
        <div class="bar"><i style="width:${p/POOL*100}%;background:${EL[e].color}"></i></div>
        <b>${p}</b><button data-a="inc" data-e="${e}" ${left<=0?'disabled':''}>+</button></div>
      <div class="stats"><span class="tag">⚔×${power(p).toFixed(1)}</span><span class="tag">🎯${Math.round(critChance(p)*100)}%</span><span class="tag">⚡${discount(p)?'−'+discount(p):'0'}</span><span class="stars">${stars(p)}</span></div>
    </div>`}).join('')}
  </div>
  <details class="card"><summary>❔</summary><div class="legend">
    <span>❤️ HP</span><span>⚡ energy</span><span>⚔ power</span><span>🎯 crit</span>
    <span>✦ points</span><span>🔁 repeat bonus</span><span class="g">▲ you counter</span><span class="r">▼ you're countered</span>
    <span>⚔️ strike</span><span>🏹 pierce</span><span>💥 surge</span><span>🛡️ ward</span><span>🧘 focus</span><span>🧠 foe skill</span></div></details>
  <button class="go" data-a="start" ${left!==0?'disabled':''}>▶</button>`;
}
function preset(n){
  n=+n;const b=mkBuild({}),o=ORDER.indexOf(G.focus);
  ({1:[20],2:[10,10],3:[7,7,6],5:[4,4,4,4,4],0:[]})[n].forEach((v,i)=>b[ORDER[(o+i)%5]]=v);
  G.build=b;renderBuild();
}

/* ---------- BATTLE ---------- */
function startDuel(){
  const en=ENEMIES[G.level];
  G.P=mkFighter('You',{...G.build});G.E=mkFighter(en.name,{...en.build});
  G.turn=1;G.hist=[];G.over=false;G.last=null;
  G.sel={el:ORDER.reduce((a,e)=>G.build[e]>G.build[a]?e:a,ORDER[0]),int:3,form:'strike'};
  renderBattle();
}
const curMove=()=>G.sel.form==='focus'?{form:'focus',el:null,int:0}:{...G.sel};
function fixSel(){
  const s=G.sel;
  if(s.form!=='focus'){
    if(G.P.build[s.el]<=0)s.el=ORDER.find(e=>G.P.build[e]>0);
    while(costOf(G.P,curMove())>G.P.energy&&s.int>1)s.int--;
    if(costOf(G.P,curMove())>G.P.energy)s.form='strike';
    if(costOf(G.P,curMove())>G.P.energy)s.form='focus';
  }
}
const pips=n=>`<div class="pips">${Array.from({length:MAXEN},(_,i)=>`<i class="${i<n?'on':''}"></i>`).join('')}</div>`;
function fighterPanel(f,you,av){
  return`<div class="card row" style="align-items:center">
    <div class="avatar">${av}</div>
    <div class="fighter sp">
      <div class="row"><span>❤️</span><div class="bar hp ${you?'you':''}"><i style="width:${Math.max(0,f.hp)}%"></i><b>${Math.max(0,f.hp)}</b></div></div>
      <div class="row">${pips(f.energy)}<span class="sp"></span><div class="hist">${icons(f.hist)}</div></div>
    </div></div>`;
}
function estimate(f,m){const r=k=>Math.round(attackDmg(f,m,k,false));return{adv:r('adv'),same:r('same'),res:r('res')}}
function side(m,s,took,absorbed,crit){
  const body=m.form==='focus'?`<div class="orb big" style="--c:#8f98cf">🧘</div>`:orb(m.el,'big'+(took>0?' hit':''));
  return`<div class="side">${body}
    <div>${FI[m.form]}${m.form==='focus'?'':' <span class="dim" style="font-size:.7rem">'+dots(m.int)+'</span>'}${crit?' ✨':''}</div>
    <div class="${took>0?'dmg':'dmg z'}">${took>0?'−'+took:'0'}</div>
    <div class="sub">${absorbed>0?'🛡'+Math.round(absorbed):''}${s&&s.streak>1?' 🔁':''}</div></div>`;
}
function renderArena(){
  const L=G.last;
  if(!L)return`<div class="clash"><div class="side">${G.P?'':''}<div class="orb big" style="--c:#8f98cf;opacity:.4">❔</div></div><div class="mid same">⚔</div><div class="side"><div class="orb big" style="--c:#8f98cf;opacity:.4">❔</div></div></div>`;
  const rel=L.r.sp.rel;
  const sym=rel==='adv'?['▲','adv']:rel==='res'?['▼','res']:rel==='open'?['🎯','adv']:rel===null?['🎯','res']:['＝','same'];
  return`<div class="clash">${side(L.mp,L.r.sp,L.r.dP,L.r.toP.absorbed,L.r.sp.crit)}<div class="mid ${sym[1]}">${sym[0]}</div>${side(L.me,L.r.se,L.r.dE,L.r.toE.absorbed,L.r.se.crit)}</div>`;
}
function renderBattle(){
  ladder();fixSel();
  const P=G.P,E=G.E,s=G.sel,m=curMove(),foc=s.form==='focus';
  const cost=costOf(P,m),est=foc?null:estimate(P,m),pp=foc?0:P.build[s.el],sb=foc?1:streakBonus(P,m);
  const en=ENEMIES[G.level],col=foc?'#8f98cf':EL[s.el].color;
  $('#app').innerHTML=`
  ${fighterPanel(E,false,en.av)}
  <div class="card" id="arena">${renderArena()}</div>
  ${fighterPanel(P,true,'🧙')}
  <div class="card">
    ${wheel(foc?null:s.el,'el',P.build)}
    <div class="row" style="justify-content:center;margin:6px 0 10px">${[1,2,3,4,5].map(i=>{const tm=foc?0:costOf(P,{...m,int:i});
      return`<button class="int ${s.int===i&&!foc?'on':''}" style="--c:${col}" data-a="int" data-i="${i}" ${foc||tm>P.energy?'disabled':''}><span class="d">${dots(i)}</span><span class="c">⚡${foc?'–':tm}</span></button>`}).join('')}</div>
    <div class="row">${Object.keys(FORMS).map(f=>{const tm=f==='focus'?0:costOf(P,{el:foc?ORDER.find(e=>P.build[e]>0):s.el,int:1,form:f});
      return`<button class="fbtn ${s.form===f?'on':''}" data-a="form" data-f="${f}" ${tm>P.energy?'disabled':''}>${FI[f]}</button>`}).join('')}</div>
    <div class="sub" style="text-align:center;margin-top:6px">${FCAP[s.form]}</div>
    <div class="sum">${foc?`<span class="tag">⚡ → ${Math.min(MAXEN,P.energy+REGEN+4)}</span>`:
      `<span class="tag">⚡${cost}</span><span class="tag">🎯${Math.round(critChance(pp)*100)}%</span>${sb>1?`<span class="tag">🔁×${sb.toFixed(1)}</span>`:''}
       <span class="tag g">▲${est.adv}</span><span class="tag">＝${est.same}</span><span class="tag r">▼${est.res}</span>${s.form==='ward'?`<span class="tag">🛡${Math.round(wardShield(P,m,'same'))}</span>`:''}`}</div>
    <button class="go" data-a="play" style="${foc?'':`background:linear-gradient(180deg,${col},color-mix(in srgb,${col} 55%,#000))`}">${foc?'🧘':EL[s.el].icon+' '+FI[s.form]}</button>
  </div>
  <div class="card"><div class="dim" style="font-size:.75rem;margin-bottom:6px">⏱ ${G.turn}</div><div class="log">${G.hist.slice(-6).reverse().join('')||'<span class="dim">—</span>'}</div></div>`;
}
function mvStr(m,took){return m.form==='focus'?'🧘':`${EL[m.el].icon}${FI[m.form]}${m.int}`}
function play(){
  if(G.over)return;
  const P=G.P,E=G.E,en=ENEMIES[G.level],mp=curMove();
  if(costOf(P,mp)>P.energy)return;
  const me=aiChoose(E,P,en.ai),r=resolve(P,E,mp,me,G.turn);
  P.hp-=r.dP;E.hp-=r.dE;
  G.hist.push(`<div><span>${mvStr(mp)} <span class="g">${r.dE?'→'+r.dE:''}</span></span><span><span class="r">${r.dP?r.dP+'←':''}</span> ${mvStr(me)}</span></div>`);
  G.last={mp,me,r};
  endTurn(P,mp);endTurn(E,me);G.turn++;
  if(P.hp<=0||E.hp<=0){G.over=true;renderBattle();setTimeout(finish,800)}else renderBattle();
}
function finish(){
  const P=G.P,E=G.E;let em,btn,a;
  if(P.hp<=0&&E.hp<=0){em='⚖️';btn='↻';a='retry'}
  else if(P.hp<=0){em='💀';btn='↻';a='retry'}
  else if(G.level>=ENEMIES.length-1){em='🏆';btn='↻';a='restart'}
  else{em='✨';btn='▶ '+ENEMIES[G.level+1].av;a='next'}
  $('#modal').innerHTML=`<div class="modal"><div class="card"><div class="em">${em}</div>${P.hp>0&&E.hp<=0?`<div style="margin:6px 0 14px">❤️ ${P.hp}</div>`:'<div style="height:14px"></div>'}<button class="go" data-a="${a}">${btn}</button></div></div>`;
}

document.addEventListener('click',ev=>{
  const t=ev.target.closest('[data-a]');if(!t||t.disabled)return;
  const a=t.dataset.a;
  if(a==='inc'&&POOL-pts(G.build)>0){G.build[t.dataset.e]++;renderBuild()}
  else if(a==='dec'&&G.build[t.dataset.e]>0){G.build[t.dataset.e]--;renderBuild()}
  else if(a==='focus'){G.focus=t.dataset.e;renderBuild()}
  else if(a==='preset')preset(t.dataset.v);
  else if(a==='start'&&pts(G.build)===POOL)startDuel();
  else if(a==='el'){G.sel.el=t.dataset.e;if(G.sel.form==='focus')G.sel.form='strike';renderBattle()}
  else if(a==='int'){G.sel.int=+t.dataset.i;renderBattle()}
  else if(a==='form'){G.sel.form=t.dataset.f;renderBattle()}
  else if(a==='play')play();
  else if(a==='retry'||a==='next'||a==='restart'){
    $('#modal').innerHTML='';
    if(a==='next')G.level++;
    if(a==='restart'){G.level=0;G.build=mkBuild({fire:10,water:10})}
    renderBuild();window.scrollTo(0,0);
  }
});
renderBuild();
}
</script>
</body>
</html>
