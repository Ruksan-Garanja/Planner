<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Elemental Duel</title>
<style>
:root{
  --bg:#0b0e1d; --bg2:#141936; --card:#1a2040; --card2:#232a55; --line:#343b70;
  --text:#eef0ff; --dim:#8f98cf; --good:#5ee6a0; --bad:#ff6b7d; --warn:#ffd166; --accent:#8b7bff;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--text);
  background:radial-gradient(900px 600px at 50% -10%,#262e6e 0%,var(--bg) 65%) fixed;min-height:100vh;user-select:none}
.wrap{max-width:520px;margin:0 auto;padding:12px 12px 40px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:disabled{cursor:not-allowed}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.logo{font-weight:900;letter-spacing:.12em;font-size:.95rem}
.ladder{display:flex;gap:6px}
.ladder span{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:1rem;background:var(--card);border:2px solid var(--line);filter:grayscale(1) opacity(.5)}
.ladder span.done{filter:none;border-color:var(--good)} .ladder span.cur{filter:none;border-color:var(--warn);box-shadow:0 0 10px var(--warn)}
.card{background:linear-gradient(180deg,var(--card),var(--bg2));border:1px solid var(--line);border-radius:18px;padding:12px;margin-bottom:10px}
.dim{color:var(--dim)}
.row{display:flex;align-items:center;gap:8px}
.sp{flex:1}
.orb{--c:#fff;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:1.4rem;
  background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--c) 55%,#fff 0%),color-mix(in srgb,var(--c) 18%,#000) 75%);
  border:2px solid var(--c);box-shadow:0 0 14px -3px var(--c);flex:none}
.orb.big{width:84px;height:84px;font-size:2.6rem}
.avatar{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;font-size:2rem;background:#0006;border:2px solid var(--line);flex:none}
/* bars */
.bar{flex:1;height:16px;border-radius:9px;background:#0008;overflow:hidden;position:relative}
.bar i{position:absolute;left:0;top:0;height:100%;border-radius:9px;transition:width .35s cubic-bezier(.2,.8,.2,1)}
.bar.hp i{background:linear-gradient(90deg,#d9435a,#ff8a6b)} .bar.hp.you i{background:linear-gradient(90deg,#2ec27e,#7bf3b9)}
.bar b{position:absolute;z-index:2;inset:0;display:grid;place-items:center;font-size:.72rem;text-shadow:0 1px 2px #000}
.pips{display:flex;gap:3px} .pips i{width:15px;height:10px;border-radius:3px;background:#0008}
.pips i.on{background:var(--warn);box-shadow:0 0 6px #ffd16688}
.hist{display:flex;gap:2px;font-size:.95rem;min-height:1.3rem}
.tag{display:inline-flex;gap:3px;align-items:center;background:#0006;border-radius:8px;padding:2px 7px;font-size:.78rem;white-space:nowrap}
.stars{color:var(--warn);letter-spacing:-1px;font-size:.7rem}
.fighter{display:flex;flex-direction:column;gap:7px}
/* wheel */
.wheel{display:block;width:100%;max-width:340px;margin:0 auto;touch-action:manipulation}
.wheel g[data-a]{cursor:pointer}
.wheel .n{transition:transform .12s;transform-box:fill-box;transform-origin:center}
.wheel g[data-a]:active .n{transform:scale(.92)}
/* build */
.brow{display:grid;grid-template-columns:44px 1fr;gap:6px 10px;align-items:center;padding:6px 0}
.step{display:flex;align-items:center;gap:6px}
.step button{width:34px;height:34px;border-radius:10px;background:var(--card2);border:1px solid var(--line);font-size:1.1rem;font-weight:800}
.step button:disabled{opacity:.25}
.step .bar{height:12px}
.step b{width:26px;text-align:center}
.stats{display:flex;gap:6px;font-size:.78rem;grid-column:2;margin-top:-2px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{min-width:46px;height:38px;padding:0 10px;border-radius:12px;background:var(--card2);border:1px solid var(--line);font-size:1rem;display:grid;place-items:center}
.chip.on{background:var(--accent);border-color:var(--accent)}
.chip:disabled{opacity:.3}
.left{font-weight:900;font-size:1.3rem} .left.ok{color:var(--good)}
.go{width:100%;height:54px;border-radius:16px;background:linear-gradient(180deg,#9b8cff,#6d5cf0);font-size:1.6rem;font-weight:800;box-shadow:0 6px 18px -6px #6d5cf0}
.go:disabled{opacity:.35;box-shadow:none}
/* battle */
.clash{display:grid;grid-template-columns:1fr 54px 1fr;align-items:start;text-align:center;min-height:150px}
.clash .side{display:flex;flex-direction:column;align-items:center;gap:6px}
.mid{align-self:center;font-size:2.2rem;font-weight:900}
.mid.adv{color:var(--good)} .mid.res{color:var(--bad)} .mid.same{color:var(--dim)}
.dmg{font-size:1.5rem;font-weight:900;color:var(--bad);animation:pop .5s}
.dmg.z{color:var(--dim);font-size:1.1rem}
@keyframes pop{0%{transform:scale(.4);opacity:0}60%{transform:scale(1.3)}100%{transform:scale(1);opacity:1}}
.orb.hit{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.sub{font-size:.85rem;color:var(--dim);min-height:1.2em}
.int{width:54px;height:54px;border-radius:50%;background:var(--card2);border:2px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.int .d{font-size:.55rem;letter-spacing:1px;color:var(--text)} .int .c{font-size:.7rem;color:var(--warn)}
.int.on{border-color:var(--c,#fff);background:#2e3670;box-shadow:0 0 12px -2px var(--c,#fff)}
.int:disabled{opacity:.25}
.fbtn{flex:1;height:48px;border-radius:14px;background:var(--card2);border:2px solid var(--line);font-size:1.4rem;display:grid;place-items:center}
.fbtn.on{border-color:var(--accent);background:#313a7c}
.fbtn:disabled{opacity:.25}
.sum{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:10px 0;font-size:.95rem}
.sum .tag{font-size:.95rem;padding:4px 9px}
.g{color:var(--good)} .r{color:var(--bad)} .w{color:var(--warn)}
.log{display:flex;flex-direction:column;gap:3px;font-size:.88rem}
.log div{display:flex;justify-content:space-between;gap:8px;background:#0004;border-radius:8px;padding:3px 8px}
.modal{position:fixed;inset:0;background:#000c;display:grid;place-items:center;padding:16px;z-index:10}
.modal .card{text-align:center;width:min(340px,100%);margin:0;padding:22px}
.modal .em{font-size:4.2rem}
details summary{cursor:pointer;font-size:.9rem;list-style:none;text-align:center;color:var(--dim)}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;font-size:.82rem;margin-top:8px}

/* ===== motion + interaction ===== */
.bar i.gh{background:#fff9;transition:width .9s ease .5s}
.bar.low{animation:lowp .7s infinite alternate} @keyframes lowp{to{box-shadow:0 0 14px #ff3b5c;filter:brightness(1.3)}}
.avatar.low{border-color:var(--bad);animation:lowp .7s infinite alternate}
.pips i{transition:background .2s,transform .2s}
.pips i.spend{background:var(--warn);animation:blink .45s infinite alternate}
@keyframes blink{to{background:#ff8a3d;transform:scaleY(.55);opacity:.45}}
.pips i.tick{animation:tick .5s}
@keyframes tick{0%,40%,80%{opacity:.15}20%,60%,100%{opacity:1}}
#app{will-change:transform}
.arena{position:relative;overflow:hidden;padding:14px 8px 10px}
.arena .clash{display:grid;grid-template-columns:1fr 50px 1fr;align-items:center;min-height:160px}
.side{display:flex;flex-direction:column;align-items:center;gap:6px}
.ow{position:relative;width:max-content;display:grid;place-items:center;animation:bob 2.4s ease-in-out infinite}
.ow.go{animation:none}
@keyframes bob{50%{transform:translateY(-5px)}}
.orb.big{transform:scale(var(--k,1));transition:transform .2s cubic-bezier(.3,1.6,.5,1),box-shadow .2s,border-color .2s,background .2s;box-shadow:0 0 calc(10px + var(--g,1)*8px) -2px var(--c)}
.orb .fb{position:absolute;right:-6px;bottom:-4px;font-size:1.25rem;background:#0b0e1d;border-radius:50%;width:32px;height:32px;display:grid;place-items:center;border:2px solid var(--line)}
.orb.big{position:relative}
.inf{font-size:.9rem;min-height:1.4em;display:flex;gap:6px;align-items:center;justify-content:center}
.mid{font-size:2.2rem;font-weight:900;text-align:center;min-height:1.2em}
.mid.adv{color:var(--good)} .mid.res{color:var(--bad)} .mid.same{color:var(--dim)}
.fx{position:absolute;inset:0;pointer-events:none}
.fx span,.fx div{position:absolute}
.fl{font-weight:900;font-size:1.8rem;text-shadow:0 2px 6px #000}
.wheel .ln{transition:stroke .25s,stroke-width .25s,opacity .25s;stroke:#5b6399;stroke-width:1.5;opacity:.45}
.wheel .ln.n{opacity:.75}
.wheel .ln.g{stroke:#5ee6a0;stroke-width:3.5;opacity:1;stroke-dasharray:9 6;animation:flow .6s linear infinite}
.wheel .ln.r{stroke:#ff6b7d;stroke-width:3.5;opacity:1;stroke-dasharray:9 6;animation:flow .6s linear infinite}
.wheel .ln.d{opacity:.3}
@keyframes flow{to{stroke-dashoffset:-15}}
.wheel .nd{transition:opacity .2s;cursor:pointer}
.wheel .nd.off{opacity:.28;cursor:not-allowed}
.wheel .nd .c{transition:stroke-width .2s}
.wheel .nd .ring,.wheel .nd .foe{fill:none;opacity:0;transform-box:fill-box;transform-origin:center}
.wheel .nd.sel .ring{opacity:1;animation:ringp 1.1s ease-out infinite}
.wheel .nd.foeon .foe{opacity:.95;stroke:#ff6b7d;stroke-dasharray:5 4;animation:spin 6s linear infinite}
@keyframes ringp{from{transform:scale(1);opacity:.9}to{transform:scale(1.5);opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
.wheel .nd .n{transition:transform .15s cubic-bezier(.3,1.6,.5,1);transform-box:fill-box;transform-origin:center}
.wheel .nd.sel .n{transform:scale(1.12)}
.wheel .nd:active .n{transform:scale(.9)}
/* slider */
.sl{position:relative;padding:6px 14px 0;touch-action:none;margin:4px 0 6px}
.trk{position:relative;height:16px;border-radius:8px;background:#0008;margin:12px 14px 4px}
.trk .fill{position:absolute;left:0;top:0;bottom:0;border-radius:8px;transition:width .12s,background .2s}
.trk .lock{position:absolute;right:0;top:0;bottom:0;background:repeating-linear-gradient(45deg,#ff6b7d33 0 5px,transparent 5px 10px);border-radius:0 8px 8px 0;transition:width .2s}
.trk .nt{position:absolute;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:#fff4}
.th{position:absolute;top:50%;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;display:grid;place-items:center;font-size:.6rem;letter-spacing:1px;font-weight:800;
  background:radial-gradient(circle at 35% 30%,#fff,var(--c));color:#000;box-shadow:0 0 16px var(--c);transition:left .12s cubic-bezier(.3,1.5,.5,1),background .2s,box-shadow .2s;touch-action:none}
.cs{display:flex;justify-content:space-between;margin:14px 6px 0;font-size:.72rem;color:var(--warn)}
.cs span{width:36px;text-align:center;transition:opacity .2s}
.cs span.x{opacity:.25;text-decoration:line-through}
.sl.off{opacity:.3;pointer-events:none}
.fbtn{transition:transform .12s cubic-bezier(.3,1.6,.5,1),border-color .15s,background .15s} .fbtn.on{transform:translateY(-3px) scale(1.06)}
.fbtn:active{transform:scale(.92)}
.sum{min-height:34px}
.go{position:relative;touch-action:none;transition:transform .15s,box-shadow .2s,opacity .2s;overflow:hidden}
.go:active{transform:scale(.97)}
.go.busy{opacity:.35;pointer-events:none}
.go .up{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-size:1rem;opacity:.6;animation:upb 1.2s infinite}
@keyframes upb{50%{transform:translateY(-70%);opacity:1}}
.swipe-hint{touch-action:pan-y}
.alloc{padding:11px 0;flex:1;touch-action:pan-y;cursor:ew-resize}
.alloc .bar{height:14px}
.pop{animation:popin .35s cubic-bezier(.3,1.6,.5,1)}
@keyframes popin{from{transform:scale(.6);opacity:0}}
.modal .card{animation:popin .4s cubic-bezier(.3,1.6,.5,1)}
.modal .em{display:inline-block;animation:bob 1.6s ease-in-out infinite}
.stats .tag{transition:background .2s}
.flash{animation:fl .5s}
@keyframes fl{30%{background:#fff3}}

/* ===== fit one screen ===== */
html,body{height:100%;overflow:hidden}
body{height:100vh;height:100dvh;overscroll-behavior:none}
.wrap{height:100vh;height:100dvh;display:flex;flex-direction:column;padding:8px 10px calc(8px + env(safe-area-inset-bottom))}
header{margin-bottom:6px;flex:none;gap:8px}
.help{width:30px;height:30px;border-radius:50%;background:var(--card);border:1px solid var(--line);font-size:.9rem}
.logo{font-size:.8rem;flex:1}
.ladder span{width:26px;height:26px;font-size:.85rem}
#app{flex:1;min-height:0;display:flex;flex-direction:column;gap:6px}
#app>.card{margin:0;padding:8px 10px;flex:none}
#app>.card.grow{flex:1 1 0;min-height:0;display:flex;flex-direction:column;gap:6px}
.wheelbox{flex:1 1 0;min-height:60px;display:flex}
.wheelbox .wheel{height:100%;width:100%;max-width:none;margin:0}
.avatar.sm{width:38px;height:38px;font-size:1.4rem;border-radius:12px;border-width:2px}
.arena{padding:8px 8px 6px!important}
.ftrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ft{display:flex;align-items:center;gap:6px}
.ft .fighter{gap:5px;min-width:0}
.ft .bar{flex:none;width:100%;height:15px}
.ft .pips{gap:2px}.ft .pips i{flex:1;width:auto;height:7px}
.arena .clash{min-height:0;margin-top:4px;grid-template-columns:1fr 44px 1fr}
.orb.big{width:62px;height:62px;font-size:1.9rem}
.orb .fb{width:26px;height:26px;font-size:1rem;right:-8px;bottom:-4px}
.side{gap:3px}.inf{min-height:1em}
.hist{font-size:.8rem;min-height:1.1rem;justify-content:center}
.mid{font-size:1.8rem}
.brow{padding:2px 0;grid-template-columns:34px 1fr;gap:0 8px}
.brow .orb{width:34px;height:34px;font-size:1.1rem}
.stats{font-size:.68rem;gap:8px;margin-top:-1px;color:var(--dim)}
.step button{width:30px;height:30px}
.alloc{padding:8px 0}
.chip{min-width:34px;height:30px;padding:0 6px;font-size:.78rem}
.left{font-size:1.1rem}
.sl{margin:0;padding:0 8px}
.trk{margin:6px 14px 0}
.th{width:36px;height:36px;margin:-18px 0 0 -18px}
.cs{margin:8px 6px 0;font-size:.68rem}
.fbtn{height:40px;font-size:1.25rem}
.sum{margin:0;min-height:26px;gap:5px}.sum .tag{font-size:.82rem;padding:2px 7px}
.go{height:46px;font-size:1.4rem;flex:none}
</style>
</head>
<body>
<div class="wrap">
  <header><div class="logo">🔥🌿🪨⚡💧</div><button class="help" data-a="help">❔</button><div class="ladder" id="ladder"></div></header>
  <div id="app"></div>
</div>
<div id="modal"></div>

<script>
/* ======================= ENGINE ======================= */
const ORDER=['fire','nature','stone','storm','water'];
const EL={
  fire:{name:'Fire',icon:'🔥',color:'#ff7043'},
  nature:{name:'Nature',icon:'🌿',color:'#66bb6a'},
  stone:{name:'Stone',icon:'🪨',color:'#c2a77d'},
  storm:{name:'Storm',icon:'⚡',color:'#fdd835'},
  water:{name:'Water',icon:'💧',color:'#42a5f5'}
};
const POOL=20, MAXHP=100, MAXEN=10, REGEN=3, BASE=3.5;
const FORMS={
  strike:{name:'Strike',dmg:1,  extra:0,desc:'Balanced attack.'},
  pierce:{name:"Pierce",dmg:.75, extra:0,desc:'-25% damage, but being resisted hurts less (x0.7 instead of x0.4) and it halves enemy wards.'},
  surge: {name:'Surge', dmg:1.5,extra:1,desc:'+50% damage for +1 energy. If the enemy counters you, you take +25% damage.'},
  ward:  {name:'Ward',  dmg:.3, extra:0,desc:'Weak attack plus a shield of your element. If your element beats theirs the shield is x1.5 and reflects 30%; if it loses, x0.5.'},
  focus: {name:'Focus', dmg:0,  extra:0,desc:'No attack. Recover +4 bonus energy, but you are exposed: +25% damage taken.'}
};
const idx=e=>ORDER.indexOf(e);
function beats(a,b){const d=(idx(b)-idx(a)+5)%5;return d===1||d===2}
function relation(a,b){ if(!b) return 'open'; if(a===b) return 'same'; return beats(a,b)?'adv':'res'; }
/* Mastery: convex curve -> splitting points weakens every element, stacking sharpens one */
const power   =p=>0.6+0.95*Math.pow(Math.min(p,30)/20,1.3);
const discount=p=>p>=12?1:0;
const critChance=p=>0.05+0.25*Math.min(p/20,1.2);
const rank=p=>p>=16?'Master':p>=10?'Expert':p>=5?'Adept':p>=1?'Novice':'—';
const TYPE_MULT={adv:1.6,same:1,res:.4,open:1.25};

function mkBuild(o){const b={};ORDER.forEach(e=>b[e]=o[e]||0);return b}
function mkFighter(name,build){return{name,build,hp:MAXHP,energy:MAXEN,streakEl:null,streak:0,hist:[]}}
function costOf(f,m){
  if(m.form==='focus') return 0;
  return Math.max(1,m.int+FORMS[m.form].extra-discount(f.build[m.el]));
}
function streakBonus(f,m){
  if(m.form==='focus'||f.streakEl!==m.el) return 1;
  const p=f.build[m.el];
  return 1+Math.min(f.streak,3)*0.1*Math.min(1.5,Math.max(.3,p/10));
}
function attackDmg(f,m,rel,crit){
  if(m.form==='focus') return 0;
  let mult=TYPE_MULT[rel];
  if(rel==="res"&&m.form==="pierce") mult=.7;
  return BASE*m.int*power(f.build[m.el])*FORMS[m.form].dmg*mult*streakBonus(f,m)*(crit?1.5:1);
}
function wardShield(f,m,rel){
  if(m.form!=='ward') return 0;
  const k={adv:1.5,same:1,res:.5,open:0}[rel];
  return BASE*1.6*m.int*power(f.build[m.el])*k;
}
function resolve(P,E,mp,me,turn,rng=Math.random){
  const stress=1+0.1*Math.max(0,turn-12);
  const side=(A,m,mo)=>{
    const o={m,dmg:0,shield:0,crit:false,rel:null,streak:streakBonus(A,m)};
    if(m.form==='focus') return o;
    o.rel=relation(m.el,mo.form==='focus'?null:mo.el);
    o.crit=rng()<critChance(A.build[m.el]);
    o.dmg=attackDmg(A,m,o.rel,o.crit)*stress;
    o.shield=wardShield(A,m,o.rel);
    return o;
  };
  const sp=side(P,mp,me), se=side(E,me,mp);
  const incoming=(def,md,atk,ma,sDef,sAtk)=>{
    let d=sAtk.dmg, exposed=false;
    if(md.form==='focus'||(md.form==='surge'&&sDef.rel==='res')){d*=1.25;exposed=true}
    let sh=sDef.shield; if(ma.form==='pierce') sh*=.5;
    const absorbed=Math.min(sh,d); d-=absorbed;
    const reflect=(md.form==='ward'&&sDef.rel==='adv')?absorbed*.3:0;
    return{dmg:d,absorbed,reflect,exposed};
  };
  const toP=incoming(P,mp,E,me,sp,se), toE=incoming(E,me,P,mp,se,sp);
  const dP=Math.round(toP.dmg+toE.reflect), dE=Math.round(toE.dmg+toP.reflect);
  return{sp,se,toP,toE,dP,dE,stress};
}
function endTurn(f,m){
  if(m.form!=='focus'){
    f.streak=(f.streakEl===m.el)?f.streak+1:0; f.streakEl=m.el;
  } else {f.streak=0;f.streakEl=null}
  f.energy=Math.min(MAXEN,f.energy-costOf(f,m)+REGEN+(m.form==='focus'?4:0));
  f.hist.push(m.form==='focus'?null:m.el);
}
function pickW(items,w,rng=Math.random){
  const t=w.reduce((a,b)=>a+b,0); let r=rng()*t;
  for(let i=0;i<items.length;i++){r-=w[i]; if(r<=0) return items[i]}
  return items[items.length-1];
}
/* Enemy brain. prof: {skill:0-1 (read the player), predict:'last'|'freq'|'none', habit:0-1 (repeat own element)} */
function aiChoose(E,P,prof,rng=Math.random){
  if(E.energy<=2&&rng()<.75) return{form:'focus',el:null,int:0};
  let pred=null;
  const ph=P.hist.filter(x=>x);
  if(rng()<prof.skill&&ph.length){
    if(prof.predict==='last') pred=ph[ph.length-1];
    else if(prof.predict==='freq'){
      const rec=P.hist.slice(-6).filter(x=>x), cnt={};
      rec.forEach(x=>cnt[x]=(cnt[x]||0)+1);
      const ks=Object.keys(cnt); if(ks.length) pred=pickW(ks,ks.map(k=>cnt[k]*cnt[k]),rng);
    }
  }
  const els=ORDER.filter(e=>E.build[e]>0);
  const last=E.hist.length?E.hist[E.hist.length-1]:null;
  const w=els.map(e=>{
    let x=Math.pow(power(E.build[e]),1.6);

  for(let i=0;i<n;i++){const s=document.createElement('span'),a=Math.random()*6.28,d=50+Math.random()*90;
    s.textContent=icon;s.style.left=W/2-10+'px';s.style.top=H*.4+'px';s.style.fontSize=(14+Math.random()*14)+'px';fx.appendChild(s);
    A(s,[{transform:'translate(0,0) scale(.5)',opacity:1},{transform:`translate(${Math.cos(a)*d}px,${Math.sin(a)*d}px) rotate(${Math.random()*360}deg) scale(1)`,opacity:0}],{duration:600+Math.random()*300}).then(()=>s.remove());}
  const f=document.createElement('div');f.style.cssText=`left:${W/2-30}px;top:${H*.4-30}px;width:60px;height:60px;border-radius:50%;background:radial-gradient(circle,#fff,${color} 50%,transparent 70%)`;fx.appendChild(f);
  A(f,[{transform:'scale(.2)',opacity:1},{transform:'scale(3.2)',opacity:0}],{duration:450}).then(()=>f.remove());
}
function shieldFx(side){
  const fx=$('#fx'),d=document.createElement('div');d.textContent='🛡️';d.style.cssText=`left:${side==='P'?'12%':'62%'};top:22%;font-size:3.4rem;text-shadow:0 0 18px #7cf`;fx.appendChild(d);
  A(d,[{transform:'scale(.4)',opacity:0},{transform:'scale(1.2)',opacity:1,offset:.3},{transform:'scale(1.5)',opacity:0}],{duration:800}).then(()=>d.remove());
}
const hitAnim=el=>A(el,[{transform:'translateX(0)'},{transform:'translateX(-9px)'},{transform:'translateX(8px)'},{transform:'translateX(-5px)'},{transform:'none'}],{duration:420});
const dashX=(side)=>{const mid=$('#mid').getBoundingClientRect(),o=$('#ow'+side).getBoundingClientRect();return(mid.left+mid.width/2)-(o.left+o.width/2)};
async function play(){
  if(G.busy||G.over||G.screen!=='battle')return;
  const P=G.P,E=G.E,en=ENEMIES[G.level],mp=curMove();
  if(costOf(P,mp)>P.energy)return;
  G.busy=true;$('#go').classList.add('busy');setPips('P',P,0);
  const me=aiChoose(E,P,en.ai),r=resolve(P,E,mp,me,G.turn);
  const owP=$('#owP'),owE=$('#owE');owP.classList.add('go');owE.classList.add('go');
  $('#mid').textContent='';G.foe=null;updWheel(mp.form==='focus'?null:mp.el,P.build,'el',null);
  buzz(12);
  // 1 charge
  await Promise.all([A(owP,[{transform:'scale(1)'},{transform:'scale(1.18)'},{transform:'scale(1)'}],{duration:320}),A(owE,[{transform:'rotate(0)'},{transform:'rotate(-8deg) scale(1.1)'},{transform:'rotate(8deg) scale(1.1)'},{transform:'rotate(0)'}],{duration:320})]);
  // 2 reveal enemy
  await A($('#oE'),[{transform:'rotateY(0)'},{transform:'rotateY(90deg)'}],{duration:140,fill:'forwards'});
  setOrb('E',me);G.foe=me.form==='focus'?null:me.el;updWheel(mp.form==='focus'?null:mp.el,P.build,'el',G.foe);
  await A($('#oE'),[{transform:'rotateY(90deg)'},{transform:'rotateY(0)'}],{duration:160});$('#oE').getAnimations().forEach(a=>a.cancel());
  await sleep(120);
  // 3 dash together
  const dp=dashX('P')*.8,de=dashX('E')*.8;
  const dP=A(owP,[{transform:'translateX(0)'},{transform:`translateX(${dp}px) scale(1.15)`}],{duration:210,easing:'cubic-bezier(.6,0,1,.6)',fill:'forwards'});
  const dE=A(owE,[{transform:'translateX(0)'},{transform:`translateX(${de}px) scale(1.15)`}],{duration:210,easing:'cubic-bezier(.6,0,1,.6)',fill:'forwards'});
  await Promise.all([dP,dE]);
  // 4 impact
  const sym=r.sp.rel==='adv'?['▲','adv']:r.sp.rel==='res'?['▼','res']:r.sp.rel==='open'?['🎯','adv']:r.sp.rel===null?['🎯','res']:['＝','same'];
  const mid=$('#mid');mid.textContent=sym[0];mid.className='mid '+sym[1];A(mid,[{transform:'scale(.2)'},{transform:'scale(1.8)'},{transform:'scale(1)'}],{duration:380});
  const winEl=r.sp.rel==='adv'?mp.el:r.se.rel==='adv'?me.el:(mp.el||me.el);
  burst(winEl?EL[winEl].icon:'✨',r.sp.crit||r.se.crit?18:11,winEl?EL[winEl].color:'#fff');
  P.hp-=r.dP;E.hp-=r.dE;
  setBar('P',P);setBar('E',E);
  if(r.dE>0){floatTxt('E','−'+r.dE,'#ff6b7d',r.dE>=25?'2.4rem':null);hitAnim($('#owE'));hitAnim($('#avE'));}
  else floatTxt('E','0','#8f98cf');
  if(r.dP>0){floatTxt('P','−'+r.dP,'#ff6b7d',r.dP>=25?'2.4rem':null);hitAnim($('#owP'));hitAnim($('#avP'));}
  else floatTxt('P','0','#8f98cf');
  if(r.sp.crit)floatTxt('P','✨','#ffd166');if(r.se.crit)floatTxt('E','✨','#ffd166');
  if(r.toE.absorbed>0)shieldFx('E');if(r.toP.absorbed>0)shieldFx('P');
  [['hpP',r.dP],['hpE',r.dE]].forEach(([id,d])=>{if(d>0)A($('#'+id),[{filter:'brightness(2.4)'},{filter:'none'}],{duration:300})});
  const big=Math.max(r.dP,r.dE);
  if(big>0)A($('#app'),[{transform:'translate(0,0)'},{transform:`translate(${-Math.min(10,big/3)}px,${Math.min(6,big/5)}px)`},{transform:`translate(${Math.min(10,big/3)}px,0)`},{transform:`translate(${-Math.min(6,big/5)}px,0)`},{transform:'none'}],{duration:360});
  buzz(r.dP>0?[30,30,50]:30);
  G.hist.push(`<div><span>${mvStr(mp)} <span class="g">${r.dE?'→'+r.dE:''}</span></span><span><span class="r">${r.dP?r.dP+'←':''}</span> ${mvStr(me)}</span></div>`);
  endTurn(P,mp);endTurn(E,me);G.turn++;
  updStatus();
  await sleep(750);
  // 5 return
  await Promise.all([A(owP,[{transform:`translateX(${dp}px) scale(1.15)`},{transform:'none'}],{duration:260}),A(owE,[{transform:`translateX(${de}px) scale(1.15)`},{transform:'none'}],{duration:260})]);
  owP.getAnimations().forEach(a=>a.cancel());owE.getAnimations().forEach(a=>a.cancel());
  owP.classList.remove('go');owE.classList.remove('go');
  mid.textContent='';
  if(P.hp<=0||E.hp<=0){G.over=true;await sleep(250);finish();return}
  setOrb('E',null);G.busy=false;$('#go').classList.remove('busy');updCtl();
}
function showHelp(){
  $('#modal').innerHTML=`<div class="modal" data-a="closeh"><div class="card"><div class="legend" style="font-size:.95rem;text-align:left">
    <span>❤️ HP</span><span>⚡ energy</span><span>⚔ power</span><span>🎯 crit</span><span>✦ points</span><span>🔁 repeat bonus</span>
    <span class="g">▲ you counter</span><span class="r">▼ countered</span><span>⚔️ strike</span><span>🏹 pierce</span><span>💥 surge</span><span>🛡️ ward</span><span>🧘 focus</span><span>🧠 foe skill</span>
    <span style="grid-column:1/-1">🟢→ beats · 🔴← loses to</span>
    <span style="grid-column:1/-1">👆 drag bars · ↔ swipe wheel/forms · ⬆ flick to cast</span></div></div></div>`;
}
function finish(){
  const P=G.P,E=G.E;let em,btn,a;
  if(P.hp<=0&&E.hp<=0){em='⚖️';btn='↻';a='retry'}
  else if(P.hp<=0){em='💀';btn='↻';a='retry'}
  else if(G.level>=ENEMIES.length-1){em='🏆';btn='↻';a='restart'}
  else{em='✨';btn='▶ '+ENEMIES[G.level+1].av;a='next'}
  buzz(P.hp>0?[40,40,40,40,80]:200);
  $('#modal').innerHTML=`<div class="modal"><div class="card"><div class="em">${em}</div>${P.hp>0&&E.hp<=0?`<div style="margin:6px 0 14px">❤️ ${P.hp}</div>`:'<div style="height:14px"></div>'}<button class="go" data-a="${a}">${btn}</button></div></div>`;
}

/* ---------- events ---------- */
document.addEventListener('click',ev=>{
  if(Date.now()-suppress<350)return;
  const t=ev.target.closest('[data-a]');if(!t||t.disabled)return;
  const a=t.dataset.a;
  if(a==='focus'){G.focus=t.dataset.e;updBuild();buzz(8)}
  else if(a==='preset')preset(t.dataset.v);
  else if(a==='start'&&pts(G.build)===POOL){startDuel()}
  else if(a==='el'){if(G.busy||G.P.build[t.dataset.e]<=0)return;G.sel.el=t.dataset.e;if(G.sel.form==='focus')G.sel.form='strike';buzz(8);updCtl()}
  else if(a==='form'){if(G.busy)return;G.sel.form=t.dataset.f;buzz(8);updCtl()}
  else if(a==='play')play();
  else if(a==='help')showHelp();
  else if(a==='closeh')$('#modal').innerHTML='';
  else if(a==='retry'||a==='next'||a==='restart'){
    $('#modal').innerHTML='';
    if(a==='next')G.level++;
    if(a==='restart'){G.level=0;G.build=mkBuild({fire:10,water:10})}
    renderBuild();window.scrollTo(0,0);
  }
});
/* hold-to-repeat +/- and drag-to-allocate bars */
let holdT=null;
document.addEventListener('pointerdown',ev=>{
  const h=ev.target.closest('[data-hold]');
  if(h&&!h.disabled){const e=h.dataset.e,d=+h.dataset.hold;const step=()=>setPts(e,G.build[e]+d);step();
    holdT=setTimeout(function rep(){step();holdT=setTimeout(rep,85)},360);return}
  const al=ev.target.closest('.alloc');
  if(al){const e=al.dataset.e;al.setPointerCapture(ev.pointerId);
    const mv=x=>{const r=al.getBoundingClientRect();setPts(e,Math.round(Math.max(0,Math.min(1,(x-r.left)/r.width))*POOL))};
    mv(ev.clientX);const m=q=>mv(q.clientX),u=()=>{al.removeEventListener('pointermove',m);al.removeEventListener('pointerup',u);al.removeEventListener('pointercancel',u)};
    al.addEventListener('pointermove',m);al.addEventListener('pointerup',u);al.addEventListener('pointercancel',u);}
});
['pointerup','pointercancel','pointerleave'].forEach(t=>document.addEventListener(t,()=>{clearTimeout(holdT)},true));
renderBuild();
}
</script>
